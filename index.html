<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fd1">
<meta name="color-scheme" content="light">
<meta name="description" content="Compêndio interativo de gramática do Português europeu: explicações adaptadas à idade, esquemas, animações narradas e exercícios. Funciona sem internet.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gramática">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="app-version" content="0.11">
<title>Compêndio da Gramática de Português</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Patrick+Hand&display=swap" crossorigin>
<style>
/* Layout: caderno quadriculado; índice lateral + página do tema; cores fixas por classe de palavra */
:root{
  --paper:#ffffff; --card:#ffffff; --ink:#1b2140; --muted:#59618a; --line:#dde2f1;
  --grid:rgba(31,79,209,.07); --azul:#1f4fd1; --azul-ink:#ffffff; --azul-soft:#e7edff;
  --sol:#ffc53d; --ok:#14804f; --ok-soft:#e1f4ea; --bad:#c3304b; --bad-soft:#fde7ec;
  --c-n:#2f63e8; --c-adj:#0b8f5f; --c-det:#7442f0; --c-pro:#cf2f6a; --c-q:#08899b;
  --c-v:#e0520a; --c-adv:#a86d00; --c-prep:#55627f; --c-conj:#8a5426; --c-int:#b0127a; --c-x:#1f4fd1;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-hand:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
a{color:var(--azul)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px;border-radius:6px}
.c-n{--c:var(--c-n)}.c-adj{--c:var(--c-adj)}.c-det{--c:var(--c-det)}.c-pro{--c:var(--c-pro)}.c-q{--c:var(--c-q)}
.c-v{--c:var(--c-v)}.c-adv{--c:var(--c-adv)}.c-prep{--c:var(--c-prep)}.c-conj{--c:var(--c-conj)}.c-int{--c:var(--c-int)}.c-x{--c:var(--c-x)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:11px;background:var(--azul);color:var(--azul-ink);display:grid;place-items:center;font:800 1.05rem var(--f-display);letter-spacing:-.02em}
.bt{font:800 1rem/1.05 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{display:block;font:500 .74rem/1.3 var(--f-body);color:var(--muted)}
.spacer{flex:1}
.who{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.4em .85em;font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap}
.who:hover{border-color:var(--azul)}
.iconbtn{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.iconbtn:hover{border-color:var(--azul)}
.iconbtn svg,.btn svg,.who svg{width:20px;height:20px}
#menuBtn{display:none}
.drawer #menuBtn{display:grid}

/* ---------- estrutura ---------- */
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:44px;padding-block:28px 72px}
main{min-width:0}
.page{max-width:820px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding:0 6px 24px 0}
.side h3{font:800 .74rem var(--f-display);text-transform:uppercase;letter-spacing:.09em;color:var(--gc);margin:20px 10px 6px}
.side h3:first-of-type{margin-top:6px}
.side a{display:flex;align-items:baseline;gap:10px;padding:6px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.93rem;line-height:1.3}
.side a:hover{background:var(--azul-soft)}
.side a.on{background:var(--azul);color:var(--azul-ink)}
.side .num{font:700 .78rem var(--f-display);color:var(--muted);min-width:1.5em;font-variant-numeric:tabular-nums}
.side a.on .num{color:inherit}
.side .ck{margin-left:auto;color:var(--ok);flex:none}
.side a.on .ck{color:inherit}
.side .ck svg{width:16px;height:16px;vertical-align:-3px}
.side .sidehome{font-weight:700}
.drawer .shell{display:block}
.drawer .side{position:fixed;top:0;bottom:0;left:0;height:100%;height:100dvh;width:min(330px,86vw);max-height:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:60;background:var(--card);
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px));
  transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.25);visibility:hidden}
.drawer .side.open{transform:none;visibility:visible}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(10,14,40,.45)}
.sidehead{display:none;align-items:center;justify-content:space-between;margin-bottom:6px}
.drawer .sidehead{display:flex}
.sidehead b{font:800 1.1rem var(--f-display)}

/* dispositivos */
[data-device="tablet"] .shell{max-width:980px}
[data-device="tablet"] .page{max-width:none}
[data-device="phone"] .shell{max-width:440px;padding-bottom:110px}
@media (min-width:560px){
  [data-device="phone"] .shell{border:1px solid var(--line);border-radius:32px;background:var(--paper);padding:22px 18px 110px;margin-top:22px;margin-bottom:30px;box-shadow:0 18px 50px rgba(20,30,80,.12)}
}
.bnav{display:none}
[data-device="phone"] .bnav{display:flex;position:fixed;z-index:35;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);gap:8px;
  background:var(--card);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px))}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;border:0;background:none;color:var(--ink);text-decoration:none;font-size:.74rem;font-weight:700;cursor:pointer}
.bnav a[aria-disabled="true"]{opacity:.35;pointer-events:none}
.bnav svg{width:22px;height:22px}
[data-device="phone"] .opts{grid-template-columns:1fr}
[data-device="phone"] .bt small,[data-device="phone"] .who .dn{display:none}
[data-device="phone"] .board{font-size:1.45rem}
[data-device="phone"] .hero h1{font-size:2.3rem}
[data-device="phone"] .tw table{font-size:.86rem}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 1rem var(--f-body);padding:.7em 1.15em;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--azul);color:var(--azul-ink)}
.btn.sm{font-size:.88rem;padding:.45em .85em;box-shadow:0 2px 0 var(--ink);border-width:1.5px}
.btn.ghost{box-shadow:none;border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--azul)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ---------- marcas (classes de palavras) ---------- */
.mk{--c:var(--c-x);display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.25}
.mk .mw{padding:0 .12em;border-radius:3px;background:linear-gradient(transparent 56%,color-mix(in srgb,var(--c) 30%,transparent) 56%)}
.mk .ml{font:400 .76em/1.1 var(--f-hand);color:var(--c);white-space:nowrap;margin-top:1px}
.mk.nl{display:inline}
.prose b,.lead b{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--sol) 45%,transparent) 60%);padding:0 .05em}
.morph{display:inline-grid;vertical-align:top}
.morph>span{grid-area:1/1}
.morph .ma{animation:mOut .45s 1.3s forwards}
.morph .mb{opacity:0;color:var(--c-v);animation:mIn .5s 1.6s forwards}
@keyframes mOut{to{opacity:0;transform:translateY(-14px) rotate(-4deg)}}
@keyframes mIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- palco das animações ---------- */
.stage{position:relative;background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  border:1.5px solid var(--line);border-radius:18px;min-height:200px;display:grid;place-items:center;padding:28px 18px;overflow:hidden}
.board{font:700 clamp(1.35rem,3.4vw,2.05rem)/1.9 var(--f-display);text-align:center;max-width:100%}
.board .mk.w{display:inline-flex;flex-direction:column;vertical-align:top}
.board .sp{white-space:normal}
.board .w{display:inline-block;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 85ms)}
.board .mk .mw{background:linear-gradient(color-mix(in srgb,var(--c) 32%,transparent),color-mix(in srgb,var(--c) 32%,transparent)) no-repeat left 88%/0% 46%;animation:sweep .55s ease-out forwards;animation-delay:calc(var(--i) * 85ms + 300ms)}
.board .mk .ml{font-size:.62em;transform:rotate(-3deg);animation:lab .4s both;animation-delay:calc(var(--i) * 85ms + 520ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes sweep{to{background-size:100% 46%}}
@keyframes lab{from{opacity:0;transform:translateY(-6px) rotate(-3deg)}}
.stepno{position:absolute;top:10px;left:14px;font:400 1rem var(--f-hand);color:var(--muted)}
.cap{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:1.06rem;min-height:3.3em;max-width:65ch}
.cap .spk{flex:none;color:var(--muted);margin-top:2px}
.cap .spk svg{width:22px;height:22px}
.speaking .cap .spk{color:var(--azul);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:11px;height:11px;border-radius:6px;border:0;background:var(--line);padding:0;cursor:pointer;transition:width .2s}
.dots button.on{background:var(--azul);width:26px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);margin-left:auto;cursor:pointer}
.sw input{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:left .2s}
.sw input:checked{background:var(--azul)}
.sw input:checked::after{left:21px}
.novoice{font-size:.85rem;color:var(--muted);margin:8px 0 0}

/* ---------- página inicial ---------- */
.review{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--sol);background:color-mix(in srgb,var(--sol) 14%,var(--card));border-radius:14px;padding:10px 14px;font-size:.92rem;margin-bottom:26px}
.review b{font-family:var(--f-display)}
.review>svg{width:22px;height:22px;flex:none;margin-top:2px;color:var(--muted)}
.eyebrow{font:800 .76rem var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--gc,var(--azul));margin:0 0 10px}
.hero h1{font-size:clamp(2.3rem,5.6vw,3.9rem);font-weight:800;letter-spacing:-.025em;line-height:.98}
.hero h1 em{font-style:normal;color:var(--azul)}
.lead{font-size:1.15rem;max-width:56ch;margin:16px 0 22px;color:var(--ink)}
.hero .stage{margin-bottom:18px}
.prog{color:var(--muted);font-size:.92rem;margin:14px 0 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;max-width:360px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.legend{margin-top:44px}
.legend h2,.gsec h2{font-size:1.5rem;font-weight:800}
.legend p{color:var(--muted);margin:6px 0 14px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cls{display:inline-flex;align-items:center;gap:7px;padding:.35em .8em;border-radius:999px;border:1.5px solid var(--c);color:var(--c);font-weight:700;text-decoration:none;font-size:.92rem;background:color-mix(in srgb,var(--c) 8%,var(--card))}
.cls::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.cls:hover{background:color-mix(in srgb,var(--c) 18%,var(--card))}
.gsec{margin-top:44px}
.gsec .gh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gsec .gh h2{color:var(--ink)}
.gsec .gh span{color:var(--gc);font-weight:700;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:12px}
.tc{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s;min-width:0}
.tc:hover{border-color:var(--gc);transform:translateY(-2px)}
.tc .n{font:800 1.5rem/1 var(--f-display);color:var(--gc);font-variant-numeric:tabular-nums}
.tc b{font:700 1.06rem/1.2 var(--f-display);margin-top:6px}
.tc small{color:var(--muted);font-size:.86rem;line-height:1.35}
.tc .st{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.badge{font-size:.72rem;font-weight:700;padding:.2em .6em;border-radius:999px;background:var(--azul-soft);color:var(--ink);white-space:nowrap}
.badge.done{background:var(--ok-soft);color:var(--ok)}

/* ---------- página do tema ---------- */
.t-head h1{font-size:clamp(2.1rem,5vw,3.2rem);font-weight:800;letter-spacing:-.02em}
.t-head .sub{color:var(--muted);font-size:1.08rem;margin:8px 0 0}
.t-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-bottom:4px}
.jump button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.35em .85em;font-size:.86rem;font-weight:700;cursor:pointer}
.jump button:hover{border-color:var(--gc)}
.note{border-radius:12px;padding:10px 14px;background:var(--azul-soft);font-size:.93rem;margin-top:16px}
.sec{margin-top:44px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 80px)}
.sec>h2{font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec>h2 .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 15%,var(--card));color:var(--gc);flex:none}
.sec>h2 .ic svg{width:19px;height:19px}
.prose p{font-size:1.1rem;max-width:65ch;margin:0}
.dica{margin-top:18px;border:2px dashed var(--gc);border-radius:14px;padding:12px 16px;background:var(--card);max-width:65ch}
.dica strong{display:block;font:400 1.25rem/1.1 var(--f-hand);color:var(--gc);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.tblock h4{font-size:1.02rem;font-weight:700;margin:0 0 8px}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.tw table{border-collapse:collapse;width:100%;font-size:.93rem}
.tw th{background:color-mix(in srgb,var(--gc) 12%,var(--card));text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;padding:9px 12px;white-space:nowrap}
.tw td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.tw td:first-child{font-weight:700}
.tree{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 18px 18px 16px;overflow-x:auto}
.tree .root{display:inline-block;background:var(--ink);color:var(--paper);font:800 1.05rem var(--f-display);padding:.35em .9em;border-radius:10px}
.tree ul{list-style:none;margin:0;padding-left:20px}
.tree li{position:relative;padding:10px 0 0 20px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
.tree li:last-child::before{bottom:auto;height:30px}
.tree li::after{content:"";position:absolute;left:0;top:30px;width:16px;border-top:2px solid var(--line)}
.node{display:inline-flex;flex-direction:column;border:1.5px solid var(--gc);border-radius:10px;padding:.35em .75em;background:color-mix(in srgb,var(--gc) 7%,var(--card));max-width:100%}
.node b{font:700 .98rem var(--f-display);color:var(--gc)}
.node span{font-size:.86rem;color:var(--muted)}
.exs{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.exs li{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-size:1.12rem;line-height:2}
.exs li .say{float:right;margin-left:8px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.pn a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);min-width:0}
.pn a:hover{border-color:var(--azul)}
.pn a small{color:var(--muted);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pn a b{font-family:var(--f-display)}
.pn a.nx{text-align:right;grid-column:2}

/* ---------- conjugador ---------- */
.conj{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.conj .verbs{display:flex;flex-wrap:wrap;gap:6px}
.conj .verbs button,.conj .modes button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.3em .8em;font-weight:700;font-size:.9rem;cursor:pointer}
.conj .verbs button.on,.conj .modes button.on{background:var(--azul);color:var(--azul-ink);border-color:var(--azul)}
.conj .modes{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px;padding-top:12px;border-top:1px solid var(--line)}
.tenses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.tense{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.tense h5{margin:0 0 6px;font:700 .9rem var(--f-display);display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--c-v)}
.tense h5 button{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:grid}
.tense h5 svg{width:18px;height:18px}
.tense div{display:flex;gap:8px;font-size:.95rem;line-height:1.55}
.tense div i{font-style:normal;color:var(--muted);min-width:5.2em}
.tense div b{color:var(--c-v)}
.conj .legendc{font-size:.84rem;color:var(--muted);margin:10px 0 0}

/* ---------- exercícios ---------- */
.quiz{display:grid;gap:14px}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;transition:border-color .2s}
.q.right{border-color:var(--ok)}
.q.wrong{border-color:var(--bad)}
.q-n{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q-p{font-weight:700;font-size:1.1rem;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.opt{text-align:left;padding:.75em 1em;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:1rem;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--azul)}
.opt[disabled]{cursor:default}
.is-right{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.is-wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.toks{font-size:1.15rem;line-height:2.3}
.tok{padding:.15em .45em;border-radius:8px;border:1.5px dashed var(--muted);background:none;cursor:pointer;font-size:1.1rem}
.tok.sel{border-style:solid;border-color:var(--azul);background:var(--azul-soft)}
.tok.tgt{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.tok.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.ci{font-weight:700;flex:1 1 8em;min-width:0}
.cbs{display:flex;flex-wrap:wrap;gap:6px}
.cb{padding:.35em .75em;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:.88rem;font-weight:700}
.cb:hover:not([disabled]){border-color:var(--azul)}
.fillrow{display:flex;gap:8px;flex-wrap:wrap}
.fillrow input{flex:1 1 200px;min-width:0;font:inherit;font-size:1.05rem;padding:.6em .9em;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.fillrow input:focus{border-color:var(--azul);outline:none}
.q-fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.98rem}
.right .q-fb{background:var(--ok-soft)}
.wrong .q-fb{background:var(--bad-soft)}
.q-fb.hint{background:color-mix(in srgb,var(--sol) 22%,var(--card))}
.qsum{text-align:center;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:22px 18px}
.qsum .big{font:800 3rem/1 var(--f-display);color:var(--azul);font-variant-numeric:tabular-nums}
.qsum p{margin:8px 0 14px}
.stars{display:flex;justify-content:center;gap:6px;color:var(--sol);margin-bottom:8px}
.stars svg{width:30px;height:30px}
.stars .off{color:var(--line)}

/* ---------- configuração inicial ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(10,14,40,.55);display:grid;place-items:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:24px;max-width:640px;width:100%;padding:26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.sheet h2{font-size:1.65rem;font-weight:800}
.sheet h3{font-size:1.1rem;font-weight:700;margin:22px 0 10px}
.sheet .intro{color:var(--muted);margin:6px 0 0}
.ages{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.chip{padding:.55em 0;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:1.05rem;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--azul)}
.chip.sel,.dev.sel{background:var(--azul);color:var(--azul-ink);border-color:var(--azul)}
.sample{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px dashed var(--line);font-size:.95rem}
.sample i{font-style:normal;font:400 1.05rem var(--f-hand);color:var(--muted);display:block}
.devs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dev{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;font-size:.95rem}
.dev:hover{border-color:var(--azul)}
.dev svg{width:44px;height:44px}
.dev small{font-weight:400;font-size:.76rem;opacity:.8;text-align:center;line-height:1.3}
.sheet .row{margin-top:22px;justify-content:flex-end}
@media (max-width:420px){.devs{grid-template-columns:1fr}.dev{flex-direction:row;justify-content:flex-start;padding:12px}.dev small{text-align:left}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}
}

body.locked{overflow:hidden}
/* índice como página (telemóvel) */
.idxpage .side{position:static;height:auto;top:auto;bottom:auto;z-index:auto;max-height:none;overflow:visible;padding:0;transform:none;visibility:visible;box-shadow:none;width:auto;background:none}
.idxpage .side a{padding:11px 12px;font-size:1rem;border-bottom:1px solid var(--line);border-radius:0}
.idxpage .side a.on{border-radius:10px}
.idxpage .side h3{margin:26px 0 4px 12px}
.idxpage .sidehead{display:none!important}

.sq{padding:0 0 10px}
.sq input{width:100%;font:inherit;font-size:.95rem;padding:.6em .9em;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.sq input:focus{border-color:var(--azul);outline:none}
.sqmsg{margin:8px 4px 0;font-size:.85rem;color:var(--muted)}


html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh}
[hidden]{display:none!important}
.offchip{font-size:.78rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:.35em .8em;white-space:nowrap}
.installbtn{border-color:var(--azul);color:var(--azul)}
.toastbox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:90;display:grid;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:14px;font-weight:700;font-size:.95rem;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:tin .3s ease-out;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(10px)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.verrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.steps{margin:0;padding-left:1.3em;display:grid;gap:6px}
@media (max-width:520px){.offchip{font-size:0;padding:.45em}.offchip::before{content:"Offline";font-size:.75rem}.installbtn span{display:none}}

const TOPICS=[
/* ================= SONS E ESCRITA ================= */
{id:'letras',g:'sons',t:'Letras e sons',sub:'Alfabeto, vogais, consoantes e dígrafos',lv:'k',
ex:{k:'As palavras são feitas de **letras**. O nosso alfabeto tem **26 letras**. Cinco são **vogais** — a, e, i, o, u — e as outras são **consoantes**. Juntas, as letras formam sons e palavras.',
m:'O alfabeto português tem **26 letras**: 5 **vogais** (a, e, i, o, u) e 21 **consoantes**. As letras k, w e y aparecem em palavras estrangeiras, símbolos e nomes (km, watt, Yara). Atenção: **letra não é o mesmo que som**. O h no início da palavra não se lê (hora) e, às vezes, duas letras juntas fazem um só som: são os **dígrafos** (ch, lh, nh, rr, ss).',
g:'Distinguimos **letra** (unidade da escrita, ou grafema) de **som** (unidade da fala, ou fonema). O alfabeto tem **26 letras** — 5 vogais e 21 consoantes; k, w e y usam-se em estrangeirismos, siglas, símbolos e nomes próprios. Um **dígrafo** é um par de letras que representa um só som: ch, lh, nh, rr, ss, e ainda qu e gu antes de e ou i (queijo, guerra). Pelo contrário, uma só letra pode representar sons diferentes: o x de xarope, táxi e exame. A **ordem alfabética** organiza dicionários, índices e listas.'},
dica:'Para pôr palavras por ordem alfabética, compara a 1.ª letra; se for igual, passa à 2.ª, e assim por diante: casa, cavalo, chave.',
map:['Letras',[['Vogais','a, e, i, o, u'],['Consoantes','b, c, d, f, g…'],['Dígrafos','ch, lh, nh, rr, ss, qu, gu']]],

{h:'Dígrafos',c:['Dígrafo','Exemplos'],r:[['ch','chuva, chave'],['lh','folha, coelho'],['nh','ninho, banho'],['rr','carro, terra'],['ss','osso, passo'],['qu','queijo, quilo'],['gu','guerra, guitarra']]}],
anim:[['[c|letra] [h|letra] [a|letra] [v|letra] [e|letra]','A palavra chave tem cinco letras: c, h, a, v, e.'],
['[ch|um só som|v] a v e','Mas o c e o h, juntos, fazem um só som. A isto chama-se dígrafo.'],
['ch [a|vogal|adj] v [e|vogal|adj]','O a e o e são vogais. As outras letras são consoantes.'],
['[h|não se lê|pro] o r a','Na palavra hora, o h do início não se lê. Escreve-se, mas não se ouve!']],
exs:['A palavra **ninho** tem 5 letras, mas o [nh|dígrafo] faz um só som.','[H|não se lê]oje vou ao parque.','Ordem alfabética: abelha, borboleta, caracol, doninha.'],
q:[{t:'mc',p:'Quantas letras tem o alfabeto português?',o:['23','24','26','28'],a:2,e:'São 26 letras: 5 vogais e 21 consoantes.'},
{t:'cat',p:'Vogal ou consoante?',cats:['Vogal','Consoante'],items:[['a',0],['m',1],['o',0],['t',1],['u',0],['r',1]]},

{t:'mc',p:'Que lista está por ordem alfabética?',o:['pato, gato, rato','gato, pato, rato','rato, gato, pato'],a:1,e:'g vem antes de p, e p vem antes de r.'},
{t:'mc',p:'Em que palavra há uma letra que não se lê?',o:['bola','hora','mesa','lua'],a:1,lv:'m',e:'O h no início de «hora» não se pronuncia.'},
{t:'mc',p:'Em qual destas palavras NÃO há dígrafo?',o:['chuva','carro','janela','folha'],a:2,lv:'m',e:'«Janela» não tem ch, lh, nh, rr, ss, qu nem gu.'}]},

{id:'silabas',g:'sons',t:'Sílabas',sub:'Contar e dividir sílabas',lv:'k',
ex:{k:'Quando dizemos uma palavra devagar, ela parte-se em bocadinhos: são as **sílabas**. **Ba-na-na** tem 3 sílabas. Experimenta bater uma palma por cada sílaba!',
m:'**Sílaba** é cada grupo de sons que dizemos **de uma só vez**. Pelo número de sílabas, a palavra é **monossílaba** (1: sol), **dissílaba** (2: me-sa), **trissílaba** (3: sa-pa-to) ou **polissílaba** (4 ou mais: bor-bo-le-ta). Na divisão silábica **separam-se** rr, ss, sc, sç e xc (car-ro, pas-so, nas-cer, cres-ça, ex-ce-to) e **não se separam** ch, lh e nh (ca-cho, fi-lho, ni-nho).',
g:'**Sílaba** é cada grupo de sons pronunciado numa só emissão de voz. Pelo número de sílabas, as palavras são **monossílabas**, **dissílabas**, **trissílabas** ou **polissílabas**. Na divisão silábica **separam-se** rr, ss, sc, sç e xc (car-ro, pas-so, nas-cer, cres-ça, ex-ce-to) e **não se separam** ch, lh, nh, qu e gu. Os **ditongos** (duas vogais na mesma sílaba) não se separam: pai-xão, ou-ro; os **hiatos** (vogais em sílabas seguidas) separam-se: sa-ú-de, pa-ís. Quando uma palavra não cabe no fim da linha, faz-se a **translineação**: corta-se entre sílabas e usa-se hífen; se a palavra já tiver hífen, ele repete-se no início da linha seguinte (guarda- / -chuva).'},
dica:'Põe a mão debaixo do queixo e diz a palavra devagar: cada vez que o queixo desce, é uma sílaba!',

tabs:[{h:'Regras da divisão silábica',c:['Separa-se','Não se separa'],r:[['rr — car-ro','ch — ca-cho'],['ss — pas-so','lh — fi-lho'],['sc, sç — nas-cer, cres-ça','nh — ni-nho'],['xc — ex-ce-to','qu, gu — que-ri-do, guer-ra'],['hiatos — sa-ú-de','ditongos — pai-xão']]}],
anim:[['[bor|1] [bo|2] [le|3] [ta|4]','Borboleta: bor, bo, le, ta. Quatro sílabas! É uma palavra polissílaba.'],

['[car|1|v] [ro|2|v]','Carro divide-se em car-ro. Os dois erres ficam separados.'],
['[ni|1|n] [nho|2|n]','Ninho divide-se em ni-nho. O n e o h nunca se separam.']],
exs:['[ca|1] [va|2] [lo|3] → trissílaba','[pas|1] [sa|2] [ri|3] [nho|4] → polissílaba','[sa|1] [ú|2] [de|3] → hiato: as vogais separam-se'],
q:[{t:'cat',p:'Quantas sílabas tem cada palavra?',cats:['Monossílaba','Dissílaba','Trissílaba','Polissílaba'],items:[['sol',0],['mesa',1],['sapato',2],['borboleta',3],['pão',0],['janela',2]]},
{t:'fill',p:'Divide em sílabas, com hífenes: passarinho',a:['pas-sa-ri-nho'],e:'Os dois esses separam-se: pas-sa-ri-nho.'},
{t:'mc',p:'Qual é a divisão correta de «ninho»?',o:['nin-ho','ni-nho','n-inho'],a:1,e:'nh nunca se separa.'},
{t:'mc',p:'Qual é a divisão correta de «carro»?',o:['ca-rro','car-ro','carr-o'],a:1,e:'rr separa-se: car-ro.'},

{t:'mc',p:'Qual é a divisão correta de «nascer»?',o:['na-scer','nas-cer','nasc-er'],a:1,lv:'m',e:'sc separa-se: nas-cer.'}]},

{id:'acentuacao',g:'sons',t:'Acentuação e sílaba tónica',sub:'Palavras agudas, graves e esdrúxulas',lv:'k',
ex:{k:'Em cada palavra há uma sílaba que dizemos com **mais força**: é a **sílaba tónica**. Em ca-**FÉ** é a última; em **ME**-sa é a primeira. Às vezes há um sinal por cima de uma letra para nos ajudar a ler: é o **acento**.',
m:'A **sílaba tónica** é a que se pronuncia com mais força; as outras são **átonas**. Conforme a posição da tónica, a palavra é **aguda** (última sílaba: ca-fé, pa-pel), **grave** (penúltima: me-sa, lá-pis) ou **esdrúxula** (antepenúltima: lâm-pa-da, mú-si-ca). **Todas as esdrúxulas levam acento.** Sinais gráficos: acento **agudo** ´ (café — som aberto), acento **circunflexo** ^ (avô — som fechado), acento **grave** ` (à — contração), **til** ~ (mãe — som nasal) e **cedilha** (caça).',
g:'A **sílaba tónica** é a que se pronuncia com mais intensidade. A palavra é **aguda**, **grave** ou **esdrúxula** conforme a tónica seja a última, a penúltima ou a antepenúltima sílaba. A maior parte das palavras portuguesas é grave e não leva acento (casa, livro). Levam acento: as **agudas** terminadas em a, e, o (com ou sem s) e em -em/-ens com mais de uma sílaba (sofá, café, avós, também, parabéns); as **graves** terminadas em l, r, x, n, ps, ã(s), ão(s), um/uns, i(s) e us (útil, açúcar, tórax, hífen, bíceps, órfã, órgão, álbum, lápis, vírus); e **todas as esdrúxulas**. O acento **agudo** abre a vogal, o **circunflexo** fecha-a e o **grave** marca apenas a contração de a + a (à, àquele).'},
dica:'Para encontrar a sílaba tónica, diz a palavra como se estivesses a chamar alguém ao longe: a sílaba que «gritas» é a tónica!',
map:['Sílaba tónica',[['Aguda','última — ca-fé, pa-pel'],['Grave','penúltima — me-sa, lá-pis'],['Esdrúxula','antepenúltima — lâm-pa-da']]],
tabs:[{h:'Sinais gráficos',c:['Sinal','Nome','Exemplo'],r:[['´','acento agudo','café, árvore'],['^','acento circunflexo','avô, você'],['`','acento grave','à, àquela'],['~','til','mãe, pão'],['ç','cedilha','caça, açúcar']]},
{h:'Onde está a força?',c:['Classificação','Tónica','Exemplos'],r:[['Aguda','última','café, papel, jardim'],['Grave','penúltima','mesa, lápis, fácil'],['Esdrúxula','antepenúltima','lâmpada, música, pássaro']]}],
anim:[['ca [fé|tónica|v]','Café. A força está no fé, a última sílaba. É uma palavra aguda.'],
['[me|tónica|v] sa','Mesa. A força está no me, a penúltima sílaba. É uma palavra grave.'],

['av[ó|aberto|adj] · av[ô|fechado|n]','Avó e avô. O acento agudo abre o som; o acento circunflexo fecha-o.']],

q:[{t:'cat',p:'Aguda, grave ou esdrúxula?',cats:['Aguda','Grave','Esdrúxula'],items:[['café',0],['mesa',1],['lâmpada',2],['papel',0],['lápis',1],['música',2]]},
{t:'mc',p:'Que palavra precisa de acento?',o:['sofa','casa','bola'],a:0,e:'«Sofá» é aguda e termina em a: leva acento.'},
{t:'mc',p:'Como se chama o sinal ~ de «mãe»?',o:['acento agudo','til','cedilha'],a:1,e:'É o til; indica um som nasal.'},
{t:'fill',p:'Escreve corretamente a palavra: musica',a:['música'],e:'É esdrúxula: leva sempre acento.'},
{t:'mc',p:'Em «árvore», qual é a sílaba tónica?',o:['ár','vo','re'],a:0,e:'ÁR-vo-re: antepenúltima, palavra esdrúxula.'},
{t:'mc',p:'Porque é que «útil» tem acento?',o:['É esdrúxula','É grave terminada em l','É aguda terminada em l'],a:1,lv:'g',e:'«Útil» é grave (Ú-til) e termina em l, por isso leva acento.'}]},

{id:'pontuacao',g:'sons',t:'Sinais de pontuação',sub:'Ponto, vírgula, travessão e companhia',lv:'k',
ex:{k:'Os **sinais de pontuação** ajudam-nos a ler com a entoação certa. O **ponto final** (.) termina uma frase. O **ponto de interrogação** (?) faz uma pergunta. O **ponto de exclamação** (!) mostra emoção. A **vírgula** (,) é uma pequena pausa.',
m:'A pontuação organiza o texto e pode mudar o sentido das frases. A **vírgula** separa os elementos de uma enumeração (maçãs, peras e uvas), isola o **vocativo** (Ana, anda cá!) e aparece antes de **mas**. **Nunca** se põe vírgula entre o sujeito e o verbo. Os **dois pontos** (:) anunciam uma enumeração ou a fala de uma personagem; o **travessão** (—) introduz essa fala no diálogo; as **aspas** (« ») marcam citações; as **reticências** (…) mostram uma ideia interrompida.',
g:'A pontuação organiza o texto e desfaz ambiguidades. A **vírgula** separa elementos de uma enumeração, isola o vocativo, expressões explicativas (O Porto, cidade do Norte, …), orações relativas explicativas e orações subordinadas que vêm antes da subordinante (Quando chegares, telefona); usa-se antes de mas. **Nunca** separa o sujeito do verbo, nem o verbo dos seus complementos. O **ponto e vírgula** (;) faz uma pausa maior do que a vírgula e separa partes longas de uma enumeração. Os **dois pontos** anunciam falas, enumerações ou explicações; o **travessão** marca a fala no diálogo; as **aspas** marcam citações; os **parênteses** juntam informação acessória; as **reticências** suspendem o sentido.'},
dica:'Lê a frase em voz alta: onde fazes uma pausa natural, talvez precises de uma vírgula — mas nunca entre o sujeito e o verbo!',
map:['Pontuação',[['Fim de frase','.  ?  !  …'],['Pausas','vírgula ,  ponto e vírgula ;'],['Diálogo e citação',':  —  « »']]],
tabs:[{h:'Sinais de pontuação',c:['Sinal','Nome','Para que serve'],r:[['.','ponto final','terminar uma frase declarativa'],[',','vírgula','pausa curta, enumerações, vocativo'],['?','ponto de interrogação','fazer perguntas'],['!','ponto de exclamação','emoção, ordens, chamamentos'],[':','dois pontos','anunciar uma fala ou enumeração'],[';','ponto e vírgula','pausa maior do que a vírgula'],['…','reticências','ideia interrompida ou suspensa'],['—','travessão','início da fala no diálogo'],['« »','aspas','citações e palavras destacadas'],['( )','parênteses','informação extra']]}],

{id:'ortografia',g:'sons',t:'Dúvidas de ortografia',sub:'há ou à, mas ou mais, -ram ou -rão…',lv:'k',
ex:{k:'Há palavras que se dizem de forma parecida mas escrevem-se de maneira diferente. Uma regra útil: **antes de p e de b escreve-se m** (campo, sombra). Outra: o **ç** só aparece antes de a, o, u (caça, poço, açúcar). E lembra-te: **há** com h vem do verbo haver (Há um gato no telhado); **à** é «a + a» (Vou à escola).',
m:'Algumas palavras confundem-se porque soam parecido. **Há** (verbo haver) indica tempo passado ou existência: Há dois dias. **À** é a contração de a + a: Vou à escola. **Mas** liga ideias opostas; **mais** indica quantidade. **Porque** explica; **porquê** aparece no fim de perguntas ou como nome (o porquê); **por que** quer dizer «por qual» (Por que razão?). Lembra-te ainda: antes de p e b escreve-se **m**, e o **ç** nunca aparece antes de e nem de i.',
g:'Muitos erros ortográficos nascem de homófonos e de terminações verbais. **Há** (haver) / **à** (a + a); **mas** (oposição) / **mais** (quantidade); **porque** (explicação), **porquê** (pergunta no fim ou nome) e **por que** (= por qual). Nos verbos, **-ram** é passado e **-rão** é futuro (cantaram ontem; cantarão amanhã). **Vêm** é do verbo vir e **veem** do verbo ver; **tem** é singular e **têm** plural. Pelo Acordo Ortográfico, caíram as consoantes que não se pronunciam (ação, ótimo, direção), mas mantêm-se as que se leem (facto, pacto, egípcio).'},
dica:'Na dúvida entre «há» e «à», experimenta trocar por «existe» ou «passou»: se funcionar, escreve-se «há».',
map:['Ortografia',[['Regras','m antes de p/b · ç antes de a, o, u'],['Palavras parecidas','há/à · mas/mais · porque/porquê'],['Verbos','-ram/-rão · tem/têm · vêm/veem']]],
tabs:[{h:'Pares que se confundem',c:['Escreve…','Quando…','Exemplo'],r:[['há','verbo haver (tempo, existência)','Há muito tempo.'],['à','a + a (contração)','Vou à praia.'],['mas','ideia contrária','Quero, mas não posso.'],['mais','quantidade','Quero mais sopa.'],['porque','explicação','Fiquei porque chovia.'],['porquê','pergunta no fim / nome','Choras porquê?'],['por que','= por qual','Por que razão saíste?'],['tem / têm','ele / eles','Ele tem; eles têm.'],['vêm / veem','vir / ver','Vêm a pé; veem o filme.'],['-ram / -rão','passado / futuro','cantaram / cantarão']]},
{h:'Regras rápidas',c:['Regra','Exemplos'],r:[['m antes de p e b','campo, sombra, tampa'],['ç só antes de a, o, u','caça, poço, açúcar'],['ss entre vogais (som de s)','passo, osso'],['rr entre vogais (som forte)','carro, terra']]}],

{id:'nome',g:'classes',t:'Nome',sub:'Próprio, comum, coletivo; género e número',lv:'k',cls:'n',
ex:{k:'Os **nomes** são as palavras que usamos para chamar as **pessoas**, os **animais**, as **coisas** e os **lugares**: mãe, gato, bola, Lisboa. Os **nomes próprios** (Maria, Porto) começam sempre com letra maiúscula.',
m:'O **nome** designa pessoas, animais, objetos, lugares, sentimentos e ideias. Pode ser **próprio** (Maria, Porto, Tejo — com maiúscula) ou **comum** (menina, cidade, rio). Entre os comuns há os **coletivos**, que no singular indicam um conjunto (cardume, rebanho, alcateia). O nome varia em **género** (masculino / feminino) e em **número** (singular / plural).',
g:'O **nome** é o núcleo do grupo nominal e designa entidades concretas ou abstratas. Subclasses: **nome próprio** (Maria, Tejo, Portugal) e **nome comum**, que pode ser **coletivo** (cardume, multidão), **contável** (um livro, dois livros) ou **não contável** (água, areia). Varia em **número** e, quando se refere a seres sexuados, em **género**: por flexão (gato / gata, autor / autora), por palavras diferentes (homem / mulher, boi / vaca) ou mantendo a mesma forma — **comum de dois** (o / a estudante), **sobrecomum** (a criança) e **epiceno** (a cobra macho / a cobra fêmea).'},
dica:'Para saber se é nome, experimenta pôr «o», «a» ou «um» antes: o gato, a alegria, um lápis.',
map:['Nome',[['Próprio','Maria, Lisboa, Tejo'],['Comum','gato, mesa, alegria',[['Coletivo','cardume, rebanho']]]]],

{id:'adjetivo',g:'classes',t:'Adjetivo',sub:'Características e graus',lv:'k',cls:'adj',
ex:{k:'O **adjetivo** diz **como é** uma pessoa, um animal ou uma coisa: o gato é **preto**, a casa é **grande**, o bolo está **delicioso**. Anda sempre junto do nome.',
m:'O **adjetivo** atribui características ou qualidades ao nome e **concorda** com ele em género e número (menino alto, meninas altas). Pode apresentar **graus**: **normal** (alto), **comparativo** (mais alto do que, tão alto como, menos alto do que) e **superlativo** (altíssimo, muito alto, o mais alto).',
g:'O **adjetivo** modifica o nome e concorda com ele em género e número. Subclasses: **qualificativo** (bonito, alto — admite graus), **relacional** (marítimo, escolar — relaciona o nome com outra entidade e não admite graus) e **numeral** (primeiro, segundo — os ordinais). Graus: **comparativo** de superioridade, igualdade e inferioridade; **superlativo absoluto sintético** (felicíssimo, facílimo), **absoluto analítico** (muito feliz) e **relativo** de superioridade ou inferioridade (o mais / o menos feliz). Alguns são irregulares: bom → melhor → ótimo; mau → pior → péssimo; grande → maior → máximo; pequeno → menor → mínimo.'},
dica:'Pergunta «como é?» ao nome. A resposta é, quase sempre, um adjetivo.',
map:['Adjetivo',[['Qualificativo','bonito, alto, feliz'],['Relacional','marítimo, escolar'],['Numeral','primeiro, segundo']]],
tabs:[{h:'Graus do adjetivo',c:['Grau','Exemplo'],r:[['Normal','O Rui é alto.'],['Comparativo de superioridade','O Rui é mais alto do que a Ana.'],['Comparativo de igualdade','O Rui é tão alto como a Ana.'],['Comparativo de inferioridade','O Rui é menos alto do que a Ana.'],['Superlativo absoluto sintético','O Rui é altíssimo.'],['Superlativo absoluto analítico','O Rui é muito alto.'],['Superlativo relativo','O Rui é o mais alto da turma.']]},

{id:'determinante',g:'classes',t:'Determinante',sub:'Artigos, demonstrativos, possessivos…',lv:'k',cls:'det',
ex:{k:'Os **determinantes** são palavrinhas que vêm **antes do nome**: o, a, um, uma, este, meu… Dizem-nos se já sabemos de que coisa falamos (**o** livro) ou não (**um** livro), onde está (**este** livro) ou de quem é (**o meu** livro).',
m:'O **determinante** coloca-se antes do nome e concorda com ele em género e número. Tipos: **artigo definido** (o, a, os, as), **artigo indefinido** (um, uma, uns, umas), **demonstrativo** (este, esse, aquele…), **possessivo** (meu, teu, seu, nosso, vosso…), **interrogativo** (que, qual: Que livro queres?) e **indefinido** (outro, certo, tal: Outro dia volto).',
g:'O **determinante** especifica o nome e concorda com ele em género e número. Subclasses: **artigo definido** e **indefinido**, **demonstrativo**, **possessivo**, **interrogativo** (que, qual), **indefinido** (outro, certo, tal) e **relativo** (cujo, cuja, cujos, cujas: O aluno cujo pai é médico…), que concorda com o nome que se lhe segue. Atenção: «este», «meu» ou «qual» são **determinantes** quando acompanham um nome e **pronomes** quando o substituem (Este livro é meu → «este» é determinante; Este é o meu → «este» é pronome).'},
dica:'Se a palavra vem colada antes de um nome, é determinante. Se aparece sozinha, no lugar do nome, é pronome.',
map:['Determinante',[['Artigo','definido: o, a · indefinido: um, uma'],['Demonstrativo','este, esse, aquele'],['Possessivo','meu, teu, seu, nosso'],['Interrogativo','que, qual'],['Indefinido','outro, certo, tal'],['Relativo','cujo, cuja']]],

{id:'pronome',g:'classes',t:'Pronome',sub:'A palavra que substitui o nome',lv:'k',cls:'pro',
ex:{k:'O **pronome** substitui o nome para não o repetirmos: «A Inês chegou. **Ela** está contente.» A palavra **ela** está no lugar de Inês. Também são pronomes: eu, tu, nós, isto, alguém…',
m:'O **pronome** substitui um nome ou um grupo nominal. **Pessoal**: eu, tu, ele, ela, nós, vós, eles, elas e as formas me, te, o, a, lhe, nos, vos, os, as, lhes, mim, ti, si, comigo… Há ainda pronomes **demonstrativos** (isto, isso, aquilo), **possessivos** (o meu, quando aparece sozinho: Esse livro é o meu), **indefinidos** (alguém, ninguém, tudo, nada), **interrogativos** (quem? o quê? qual?) e **relativos** (que, quem, o qual).',
g:'O **pronome** ocupa o lugar de um grupo nominal. Os **pessoais** variam conforme a função: sujeito (eu, tu, ele…), complemento direto (o, a, os, as), complemento indireto (lhe, lhes) e formas com preposição (mim, ti, si, comigo, connosco…). Outras subclasses: **demonstrativo** (isto, isso, aquilo, e este, esse, aquele quando usados sem nome), **possessivo**, **indefinido** (alguém, ninguém, tudo, nada, algo, outrem), **interrogativo** (quem, que, o quê, qual, quanto) e **relativo** (que, quem, o qual, quanto), que introduz orações relativas e retoma um antecedente (O livro **que** li…).'},
dica:'Experimenta trocar o pronome pelo nome: se a frase continuar a fazer sentido, encontraste o que ele substitui.',
map:['Pronome',[['Pessoal','eu, tu, ele, o, lhe…'],['Demonstrativo','isto, isso, aquilo'],['Possessivo','o meu, o teu…'],['Indefinido','alguém, ninguém, tudo'],['Interrogativo','quem? o quê?'],['Relativo','que, quem, o qual']]],
tabs:[{h:'Pronomes pessoais',c:['Pessoa','Sujeito','Compl. direto','Compl. indireto','Com preposição'],r:[['1.ª singular','eu','me','me','mim, comigo'],['2.ª singular','tu','te','te','ti, contigo'],['3.ª singular','ele, ela, você','o, a','lhe','ele, ela, si, consigo'],['1.ª plural','nós','nos','nos','nós, connosco'],['2.ª plural','vós','vos','vos','vós, convosco'],['3.ª plural','eles, elas, vocês','os, as','lhes','eles, elas, si, consigo']]}],

{id:'quantificador',g:'classes',t:'Quantificador',sub:'Quantos? Todos, alguns, três…',lv:'m',cls:'q',
ex:{k:'Algumas palavras dizem-nos **quantas** coisas há: **três** maçãs, **muitos** amigos, **todos** os meninos. Chamam-se **quantificadores**.',
m:'O **quantificador** indica quantidade. **Numeral**: um, dois, vinte, cem, mil. **Universal**: todos, ambos, cada, qualquer. **Existencial**: algum, muitos, poucos, vários, bastantes. **Interrogativo**: quantos? Atenção: primeiro, segundo, terceiro (os ordinais) não são quantificadores — são **adjetivos numerais**.',
g:'O **quantificador** indica a quantidade de entidades a que o nome se refere. Subclasses: **numeral** (os cardinais: dois, cem, mil), **universal** (todo, ambos, cada, qualquer, nenhum), **existencial** (algum, vários, muito, pouco, bastante), **interrogativo** (quanto? quantos?) e **relativo** (quanto: Comeu tudo quanto quis). A palavra **um** pode ser artigo indefinido (Encontrei um amigo) ou quantificador numeral, quando conta (Tenho um irmão e duas irmãs). Os ordinais (primeiro, segundo) são adjetivos numerais.'},
dica:'Pergunta «quantos?». Se a palavra responde, é muito provável que seja um quantificador.',
map:['Quantificador',[['Numeral','três, dez, mil'],['Universal','todos, ambos, cada'],['Existencial','alguns, muitos, vários'],['Interrogativo','quantos?']]],

{id:'verbo',g:'classes',t:'Verbo',sub:'O que é, conjugações e subclasses',lv:'k',cls:'v',
ex:{k:'O **verbo** diz **o que alguém faz** (correr, comer), **o que acontece** (chover) ou **como alguém está** (estar, ficar). É o «motor» da frase!',
m:'O **verbo** indica ações, estados ou fenómenos. Varia em **pessoa** (1.ª, 2.ª, 3.ª), **número** (singular, plural), **tempo** e **modo**. A forma base é o **infinitivo** e, pela terminação, há três **conjugações**: **-ar** (cantar), **-er** (comer) e **-ir** (partir). O verbo **pôr** e os seus derivados pertencem à 2.ª conjugação.',
g:'O **verbo** é o núcleo do grupo verbal. Subclasses (Dicionário Terminológico): **verbo principal** — **intransitivo** (O bebé dorme), **transitivo direto** (Li um livro), **transitivo indireto** (Telefonei à avó; Gosto de música), **transitivo direto e indireto** (Dei uma flor à mãe) e **transitivo-predicativo** (Achei o filme divertido); **verbo copulativo** — ser, estar, ficar, parecer, permanecer, continuar, tornar-se — que liga o sujeito a um predicativo; **verbo auxiliar** — ter e haver (tempos compostos), ser (passiva), ir, estar a, começar a (outros valores). Os verbos podem ainda ser **regulares** (mantêm o radical) ou **irregulares** (ser, ir, fazer…).'},
dica:'Experimenta pôr «eu», «tu» ou «nós» antes da palavra. Se ela mudar a terminação, é um verbo: eu canto, tu cantas.',
map:['Verbo',[['Principal','correr, comer, dar'],['Copulativo','ser, estar, ficar, parecer'],['Auxiliar','ter, haver, ser, ir']]],
tabs:[{h:'Conjugações',c:['Conjugação','Termina em','Exemplos'],r:[['1.ª','-ar','cantar, saltar, brincar'],['2.ª','-er (e pôr)','comer, beber, pôr'],['3.ª','-ir','partir, sorrir, abrir']]},

{id:'tempos',g:'classes',t:'Verbo: modos e tempos',sub:'Conjugador interativo incluído',lv:'k',cls:'v',conj:true,
ex:{k:'Os verbos mudam conforme **o tempo**: **ontem** brinquei (passado), **hoje** brinco (presente), **amanhã** brincarei (futuro). Também mudam conforme **quem** faz: eu brinco, tu brincas, nós brincamos.',
m:'O verbo flexiona em **pessoa**, **número**, **tempo** e **modo**. Modos: **indicativo** (factos: Eu canto), **conjuntivo** (desejos, dúvidas, hipóteses: Espero que cantes; Se eu cantasse…), **imperativo** (ordens e pedidos: Canta!) e **condicional** (o que aconteceria: Eu cantaria). Há ainda as **formas não finitas**: infinitivo (cantar), gerúndio (cantando) e particípio (cantado).',
g:'O verbo flexiona em pessoa, número, tempo e modo. No **indicativo**, o passado divide-se em **pretérito perfeito** (ação concluída: cantei), **imperfeito** (ação habitual ou em curso no passado: cantava) e **mais-que-perfeito** (passado anterior a outro passado: cantara / tinha cantado). O **conjuntivo** exprime desejo, dúvida ou hipótese e aparece sobretudo em orações subordinadas; o **imperativo** exprime ordem ou pedido; o **condicional** exprime possibilidade ou futuro do passado (algumas gramáticas tratam-no como tempo do indicativo). Os **tempos compostos** formam-se com ter + particípio (tenho cantado, tinha cantado, terei cantado). O **infinitivo** pode ser impessoal (cantar) ou pessoal (para nós cantarmos).'},
dica:'Usa o conjugador abaixo: escolhe um verbo e um modo, e repara que nos verbos regulares só muda a terminação (a negrito).',
map:['Verbo',[['Pessoa','eu, tu, ele, nós, vós, eles'],['Tempo','presente, passado, futuro'],['Modo','indicativo, conjuntivo, imperativo, condicional']]],
tabs:[{h:'Modos verbais',c:['Modo','Exprime','Exemplo'],r:[['Indicativo','factos, certezas','Eu canto.'],['Conjuntivo','desejo, dúvida, hipótese','Espero que cantes.'],['Imperativo','ordem, pedido, conselho','Canta mais alto!'],['Condicional','possibilidade, condição','Eu cantaria se pudesse.']]}],
anim:[['Ontem [brinquei|passado|v]. Hoje [brinco|presente|v]. Amanhã [brincarei|futuro|v].','Ontem brinquei, hoje brinco, amanhã brincarei. O verbo mudou com o tempo.'],

{id:'adverbio',g:'classes',t:'Advérbio',sub:'Como? Onde? Quando?',lv:'k',cls:'adv',
ex:{k:'O **advérbio** diz-nos **como**, **onde** ou **quando** alguma coisa acontece: correu **depressa**, mora **perto**, chegou **ontem**. Nunca muda: não tem feminino nem plural.',
m:'O **advérbio** é **invariável** e modifica um verbo, um adjetivo ou outro advérbio. Pelo significado pode ser de **modo** (bem, depressa, calmamente), **tempo** (hoje, ontem, já, sempre), **lugar** (aqui, ali, perto, longe), **quantidade e grau** (muito, pouco, tão), **afirmação** (sim, certamente), **negação** (não, nunca, jamais), **dúvida** (talvez, possivelmente) e **inclusão / exclusão** (também, até / só, apenas).',
g:'O **advérbio** é **invariável** e modifica um verbo, um adjetivo, outro advérbio ou a frase inteira. Pelo significado: modo, tempo, lugar, quantidade e grau, afirmação, negação, dúvida, inclusão e exclusão. O Dicionário Terminológico distingue ainda: **advérbio interrogativo** (onde? quando? como? porque?), **advérbio relativo** (onde: A casa onde moro), **advérbio de frase** (Felizmente, chegaste) e **advérbio conectivo**, que liga frases ou parágrafos (contudo, todavia, no entanto). Muitos advérbios de modo formam-se juntando -mente ao feminino do adjetivo: rápida → rapidamente.'},
dica:'Pergunta ao verbo «como?», «onde?» ou «quando?». A resposta numa só palavra costuma ser um advérbio.',
map:['Advérbio',[['Como?','modo — depressa'],['Quando?','tempo — ontem'],['Onde?','lugar — perto'],['Quanto?','quantidade — muito']]],

{id:'preposicao',g:'classes',t:'Preposição',sub:'Palavras que ligam; contrações',lv:'m',cls:'prep',
ex:{k:'As **preposições** são palavras pequeninas que **ligam** outras palavras: de, em, para, com, sem… «Copo **de** leite», «Vou **para** casa». Às vezes juntam-se ao artigo: **de + o = do**, **em + a = na**.',
m:'A **preposição** é **invariável** e liga palavras, estabelecendo relações de lugar, tempo, posse, companhia… Preposições: a, ante, após, até, com, contra, de, desde, em, entre, para, perante, por, sem, sob, sobre, trás. Muitas vezes **contraem-se** com o artigo ou com outras palavras: de + o = **do**, em + a = **na**, a + a = **à**, por + o = **pelo**, de + este = **deste**, em + aquele = **naquele**.',
g:'A **preposição** é uma palavra invariável que introduz um grupo (grupo preposicional) e o liga a outro elemento da frase. Pode contrair-se com determinantes e pronomes (do, na, à, pelo, deste, nisso, dele). As **locuções prepositivas** funcionam como uma só preposição: ao lado de, em frente de, por causa de, apesar de, dentro de, perto de, junto a. Algumas preposições são pedidas pelo verbo e iniciam complementos oblíquos (Gosto **de** música; Preciso **de** ajuda).'},
dica:'Desfaz a contração para perceber o que está escondido: «na» = em + a; «pelo» = por + o.',
map:['Preposição',[['Simples','de, em, para, com…'],['Contrações','do, na, à, pelo'],['Locuções','ao lado de, por causa de']]],

{id:'conjuncao',g:'classes',t:'Conjunção',sub:'Coordenativas e subordinativas',lv:'m',cls:'conj',
ex:{k:'A **conjunção** **liga** palavras ou frases. **E** junta: «Gosto de maçãs **e** de peras.» **Mas** mostra uma ideia contrária: «Queria brincar, **mas** está a chover.» **Porque** explica: «Fiquei em casa **porque** chovia.»',
m:'A **conjunção** liga palavras ou orações. As **coordenativas** ligam elementos com a mesma importância: **copulativas** (e, nem), **adversativas** (mas), **disjuntivas** (ou, quer… quer), **conclusivas** (logo, portanto, por isso) e **explicativas** (pois, porque). As **subordinativas** ligam uma oração que depende de outra: causais (porque, visto que, como), temporais (quando, enquanto, assim que), finais (para que), condicionais (se, caso), concessivas (embora, ainda que), comparativas (como, do que) e consecutivas (tão… que, de modo que).',
g:'A **conjunção** liga palavras, grupos ou orações. **Coordenativas**: copulativas (e, nem), adversativas (mas), disjuntivas (ou, ou… ou, quer… quer), conclusivas (logo, portanto, por isso) e explicativas (pois, porque). **Subordinativas**: causais, temporais, finais, condicionais, concessivas, comparativas, consecutivas e **completivas** (que, se), que introduzem orações com função de complemento (Disse **que** vinha; Pergunto-te **se** vens). Quando têm várias palavras, chamam-se **locuções conjuncionais** (visto que, logo que, a fim de que). Nota: o Dicionário Terminológico classifica porém, contudo, todavia e no entanto como advérbios conectivos, embora muitos manuais os apresentem como conjunções adversativas.'},
dica:'Lê a frase sem a conjunção e pergunta: que relação havia entre as duas partes? Adição, oposição, causa, condição…?',
map:['Conjunção',[['Coordenativa','liga partes com o mesmo valor — e, mas, ou'],['Subordinativa','liga uma parte que depende — porque, quando, se']]],

{id:'interjeicao',g:'classes',t:'Interjeição',sub:'Ai! Oh! Viva!',lv:'k',cls:'int',
ex:{k:'A **interjeição** mostra uma **emoção** de forma rápida: **Ai!** (dor), **Viva!** (alegria), **Oh!** (espanto), **Olá!** (cumprimento). Quase sempre vem com ponto de exclamação.',
m:'A **interjeição** exprime emoções, sensações ou apelos de forma rápida: Ai! Uau! Ufa! Psiu! Quase sempre é seguida de ponto de exclamação. A mesma interjeição pode exprimir emoções diferentes conforme a entoação: «Oh!» pode ser espanto, pena ou admiração. Quando tem mais de uma palavra, chama-se **locução interjetiva** (Ai de mim! Ora bolas!).',
g:'A **interjeição** é uma palavra **invariável** que exprime emoções, sensações ou apelos e funciona sozinha como uma frase completa (frase não verbal). O seu valor depende muito da entoação e do contexto. As **locuções interjetivas** são grupos de palavras com o mesmo valor (Ai de mim! Ora bolas! Valha-me Deus!). Muitas interjeições são próximas das **onomatopeias**, palavras que imitam sons (zás! pum! tchim!).'},
dica:'Lê a interjeição em voz alta com expressão: a entoação ajuda a perceber que emoção está a mostrar.',
map:['Interjeição',[['Emoções','ai! viva! oh!'],['Apelos','olá! psiu! ó!'],['Locuções','ai de mim! ora bolas!']]],

/* ================= LÉXICO ================= */
{id:'formacao',g:'lexico',t:'Formação de palavras',sub:'Radical, prefixos, sufixos e composição',lv:'m',
ex:{k:'Muitas palavras **nascem de outras**! De **flor** fazemos **florzinha**, **floreira** e **florista**. A parte que se repete (**flor**) chama-se **radical**. As palavras com o mesmo radical formam uma **família de palavras**.',
m:'As palavras podem ser **simples** (mar) ou **complexas** (marinheiro, guarda-chuva). Na **derivação**, juntam-se afixos ao radical: o **prefixo** vem antes (in + feliz = infeliz) e o **sufixo** vem depois (feliz + mente = felizmente). Na **composição**, juntam-se duas ou mais palavras ou radicais: guarda-chuva, couve-flor, girassol, biologia.',
g:'Processos de formação: **derivação por prefixação** (refazer, desfazer), **por sufixação** (pedreiro, livraria), **por prefixação e sufixação** (deslealdade — existem «desleal» e «lealdade»), **parassíntese** (prefixo e sufixo juntam-se ao mesmo tempo: entristecer, desalmado — não existem «entriste» nem «tristecer») e **derivação não afixal** (lutar → luta; pescar → pesca). Na **composição morfológica** juntam-se radicais (biologia, agricultura); na **composição morfossintática** juntam-se palavras (guarda-chuva, couve-flor, saca-rolhas). Há ainda palavras formadas por **siglação** (UE, CP) e por **truncação** (foto, metro).'},
dica:'Para encontrar o radical, procura a parte que se repete em várias palavras da mesma família: pedr-a, pedr-eiro, pedr-inha.',
map:['Palavras',[['Simples','mar, flor, feliz'],['Derivadas','com prefixo ou sufixo — infeliz, florista'],['Compostas','duas palavras ou radicais — guarda-chuva, girassol']]],

['[flor|radical|n]: flor[zinha||adj] · flor[ista||adj] · flor[eira||adj]','Florzinha, florista, floreira: todas têm o radical flor. São uma família de palavras.']],

{id:'relacoes',g:'lexico',t:'Relações entre palavras',sub:'Sinónimos, antónimos, homónimos…',lv:'k',
ex:{k:'As palavras relacionam-se umas com as outras. **Sinónimos** querem dizer o mesmo (**bonito / lindo**). **Antónimos** querem dizer o contrário (**alto / baixo**). E há palavras que incluem outras: **fruta** inclui maçã, pera e banana.',
m:'Relações de **significado**: **sinónimos** (contente / alegre), **antónimos** (abrir / fechar), **hiperónimo** — palavra de sentido geral (fruta) — e **hipónimos** — palavras de sentido específico (maçã, pera); **holónimo** — o todo (corpo) — e **merónimos** — as partes (braço, perna). Relações de **forma**: **homónimos** escrevem-se e dizem-se da mesma maneira mas têm sentidos diferentes (canto, esquina / canto, do verbo cantar); **homófonos** dizem-se igual mas escrevem-se de forma diferente (concerto / conserto); **parónimos** têm formas parecidas (comprimento / cumprimento).',
g:'Relações semânticas: **sinonímia**, **antonímia**, **hiperonímia / hiponímia** (do geral para o específico) e **holonímia / meronímia** (do todo para as partes). Relações de forma: **homonímia** (mesma grafia e pronúncia, sentidos diferentes), **homofonia** (mesma pronúncia, grafia diferente: cela / sela), **homografia** (mesma grafia, pronúncia diferente: sede [ê], vontade de beber / sede [é], local principal) e **paronímia** (formas semelhantes: emigrar / imigrar). O **campo lexical** reúne palavras ligadas a um tema (escola: professor, recreio, caderno); o **campo semântico** reúne os vários sentidos de uma palavra (cabo: de vassoura, de terra, militar).'},
dica:'Para testar sinónimos, troca uma palavra pela outra na mesma frase: se o sentido não mudar, são sinónimos.',
map:['Relações',[['De significado','sinónimos, antónimos, hiperónimos'],['De forma','homónimos, homófonos, parónimos'],['De família','mesmo radical']]],

['con[c|homófonos|x]erto · con[s||x]erto','Concerto, de música, e conserto, de arranjar. Dizem-se da mesma maneira, mas escrevem-se de forma diferente.']],

/* ================= A FRASE ================= */
{id:'tipos',g:'frase',t:'Tipos e formas de frase',sub:'Declarativa, interrogativa, ativa, passiva…',lv:'k',
ex:{k:'Há frases para **contar** (A Ana chegou.), para **perguntar** (A Ana chegou?), para mostrar **emoção** (A Ana chegou!) e para **pedir ou mandar** (Chega cedo, Ana!). As frases podem ainda ser **afirmativas** ou **negativas** (A Ana **não** chegou.).',
m:'Tipos de frase: **declarativa** (informa; ponto final), **interrogativa** (pergunta; ponto de interrogação), **exclamativa** (exprime emoção; ponto de exclamação) e **imperativa** (dá ordens, conselhos ou pedidos). Todas podem ser **afirmativas** ou **negativas** (com não, nunca, nada, ninguém, nem). Uma frase pode estar na **voz ativa** (O gato comeu o peixe.) ou na **voz passiva** (O peixe foi comido pelo gato.).',
g:'Tipos de frase: **declarativa**, **interrogativa**, **exclamativa** e **imperativa**. A interrogativa pode ser **total** (resposta sim / não: Vens?) ou **parcial** (começa por palavra interrogativa: Quando vens?). Quanto à polaridade, a frase é **afirmativa** ou **negativa**. Na passagem da **voz ativa** para a **passiva**: o complemento direto passa a sujeito; o verbo passa a **ser + particípio**, no mesmo tempo e modo da ativa; o sujeito da ativa passa a **complemento agente da passiva**, introduzido por «por» (pelo, pela…). Só os verbos transitivos diretos admitem passiva.'},
dica:'O sinal no fim da frase dá uma grande ajuda: . declarativa · ? interrogativa · ! exclamativa (ou imperativa).',
map:['Frase',[['Tipos','declarativa, interrogativa, exclamativa, imperativa'],['Polaridade','afirmativa / negativa'],['Voz','ativa / passiva']]],
tabs:[{h:'Tipos de frase',c:['Tipo','Serve para…','Exemplo'],r:[['Declarativa','informar','O Rui chegou.'],['Interrogativa','perguntar','O Rui chegou?'],['Exclamativa','exprimir emoção','O Rui chegou!'],['Imperativa','mandar, pedir, aconselhar','Chega a horas, Rui.']]},

{id:'sujeito',g:'frase',t:'Sujeito, predicado e vocativo',sub:'De quem se fala e o que se diz',lv:'k',
ex:{k:'Numa frase, o **sujeito** é **de quem** ou **de quê** se fala. O **predicado** é **o que se diz** sobre o sujeito. «**O cão** | **ladra muito**.» Para encontrar o sujeito, pergunta: «Quem é que…?»',
m:'O **sujeito** é a parte da frase que concorda com o verbo. Pode ser **simples** (O cão ladra), **composto** — com mais de um núcleo (O cão e o gato brincam) — ou **nulo**, quando não aparece: **subentendido** (Fomos ao cinema → nós), **indeterminado** (Dizem que vai chover — não se sabe quem) ou **expletivo**, com verbos de fenómenos da natureza (Chove; Anoiteceu). O **predicado** contém o verbo e o que se diz sobre o sujeito. O **vocativo** serve para chamar alguém e separa-se por vírgula: Ana, anda cá!',
g:'O **sujeito** é a função sintática que concorda com o verbo em pessoa e número. Teste: muda o número do verbo — a parte que muda com ele é o sujeito (O aluno estuda → Os alunos estudam). Tipos: **simples**, **composto** e **nulo** (**subentendido**, recuperável pela terminação verbal; **indeterminado**, com verbo na 3.ª pessoa do plural ou com «se»; **expletivo**, com verbos meteorológicos e «haver» existencial). O sujeito pode vir depois do verbo (Chegaram os convidados) e pode ser uma oração (Quem espera sempre alcança). O **predicado** é o grupo verbal. O **vocativo** é exterior à frase: não pertence ao sujeito nem ao predicado.'},
dica:'Pergunta «Quem é que…?» ou «O que é que…?» antes do verbo: a resposta é o sujeito.',
map:['Frase',[['Sujeito','de quem se fala',[['Simples','um núcleo'],['Composto','dois ou mais núcleos'],['Nulo','não aparece']]],['Predicado','o que se diz'],['Vocativo','chamamento']]],

anim:[['[O cão|sujeito|n] [ladra muito|predicado|v].','O cão ladra muito. O cão é o sujeito: é de quem se fala. Ladra muito é o predicado.'],
['[A Rita e o Rui|sujeito composto|n] [jogam à bola|predicado|v].','A Rita e o Rui jogam à bola. Há dois núcleos: é um sujeito composto.'],

['[Ana|vocativo|int], [anda cá|predicado|v]!','Ana, anda cá! Ana é um vocativo: serve para chamar.']],

{id:'complementos',g:'frase',t:'Complementos e modificadores',sub:'Complemento direto, indireto, oblíquo…',lv:'m',
ex:{k:'Algumas palavras **completam** o que o verbo diz. Em «A Rita come **uma maçã**», «uma maçã» diz **o quê** ela come: é um **complemento**. Outras dão informações extra, como **onde** ou **quando**: «A Rita come **no recreio**.»',
m:'**Complemento direto**: responde a «o quê?» ou «quem?» e pode ser substituído por o, a, os, as (Comi a maçã → Comi-a). **Complemento indireto**: indica a quem se destina a ação; é introduzido por «a» e substitui-se por lhe, lhes (Dei um livro à Ana → Dei-lhe um livro). **Complemento oblíquo**: é pedido pelo verbo, vem com preposição e não se substitui por lhe (Gosto de música; Moro em Braga; Vou a Lisboa). **Predicativo do sujeito**: aparece com verbos copulativos e caracteriza o sujeito (A Ana é simpática). **Modificador**: informação acessória que se pode retirar sem a frase ficar incompleta (Ontem, joguei no parque).',
g:'No grupo verbal: **complemento direto** (→ o, a, os, as), **complemento indireto** (→ lhe, lhes), **complemento oblíquo** (selecionado pelo verbo, com preposição, não substituível por lhe), **complemento agente da passiva** (O livro foi lido **pelos alunos**), **predicativo do sujeito** (com verbo copulativo), **predicativo do complemento direto** (Acho o filme **divertido**; Elegeram-no **delegado**) e **modificador do grupo verbal** (Jantámos **cedo**). Ao nível da frase há o **modificador de frase** (**Felizmente**, chegaste). Dentro do grupo nominal: **complemento do nome** (a destruição **da cidade**), **modificador restritivo do nome** (o livro **azul**) e **modificador apositivo do nome**, entre vírgulas (Lisboa, **capital de Portugal**, …).'},
dica:'Teste rápido: tira essa parte da frase. Se a frase fica «coxa», era um complemento; se continua bem, era um modificador.',
map:['Grupo verbal',[['Complementos','obrigatórios',[['Direto','o quê? quem?'],['Indireto','a quem?'],['Oblíquo','de, em, a…'],['Predicativo','com ser, estar…']]],['Modificadores','podem sair']]],
tabs:[{h:'Funções no grupo verbal',c:['Função','Pergunta / teste','Exemplo'],r:[['Complemento direto','o quê? quem? → o, a, os, as','Comi [a maçã].'],['Complemento indireto','a quem? → lhe, lhes','Escrevi [à avó].'],['Complemento oblíquo','pedido pelo verbo, com preposição','Gosto [de música].'],['Agente da passiva','por quem? (na passiva)','Foi feito [pelo Rui].'],['Predicativo do sujeito','com ser, estar, ficar, parecer…','O Rui está [cansado].'],['Predicativo do compl. direto','caracteriza o compl. direto','Acho o jogo [fácil].'],['Modificador','pode retirar-se','Joguei [no parque].']]}],
anim:[['[O Rui|sujeito|n] [deu|verbo|v] [um livro|compl. direto|adj] [à Ana|compl. indireto|pro] [ontem|modificador|adv].','O Rui deu um livro à Ana ontem. Um livro é o complemento direto. À Ana é o complemento indireto. Ontem é um modificador.'],
['Deu-[o|compl. direto|adj] à Ana. · Deu-[lhe|compl. indireto|pro] um livro.','Deu-o à Ana. Deu-lhe um livro. O complemento direto troca por o; o indireto troca por lhe.'],

{id:'coordenacao',g:'oracoes',t:'Frase complexa: coordenação',sub:'Orações independentes ligadas',lv:'m',
ex:{k:'Às vezes juntamos duas frases numa só, com palavras como **e**, **mas** ou **ou**: «O Rui come **e** a Ana bebe.» Cada parte com um verbo chama-se **oração**.',
m:'A **frase simples** tem uma só oração (um verbo principal): O Rui chegou. A **frase complexa** tem duas ou mais orações. Na **coordenação**, as orações são independentes: cada uma faz sentido sozinha. Tipos: **copulativa** (e, nem): Li e escrevi. **Adversativa** (mas): Corri, mas perdi o autocarro. **Disjuntiva** (ou): Estudas ou sais? **Conclusiva** (logo, portanto, por isso): Choveu, por isso fiquei. **Explicativa** (pois, porque): Leva casaco, pois está frio.',
g:'A **frase complexa** tem mais de uma oração. Na **coordenação**, as orações estão no mesmo plano sintático e nenhuma depende da outra. Classificação: **copulativa**, **adversativa**, **disjuntiva**, **conclusiva** e **explicativa**. Quando as orações se ligam apenas por vírgulas, sem conjunção, a coordenação diz-se **assindética** (Cheguei, vi, venci); com conjunção, **sindética**. Para contar orações, conta os verbos principais: num tempo composto ou com verbo auxiliar (tinha saído, vou estudar) há uma só oração.'},
dica:'Conta os verbos principais: cada um costuma corresponder a uma oração.',
map:['Frase',[['Simples','1 oração'],['Complexa','2 ou mais orações',[['Coordenação','orações independentes'],['Subordinação','uma depende da outra']]]]],
tabs:[{h:'Orações coordenadas',c:['Tipo','Conjunções','Exemplo'],r:[['Copulativa','e, nem','Estudei e passei.'],['Adversativa','mas','Estudei, mas não passei.'],['Disjuntiva','ou, ou… ou','Ou estudas ou chumbas.'],['Conclusiva','logo, portanto, por isso','Estudei, por isso passei.'],['Explicativa','pois, porque','Passei, pois estudei muito.']]}],
anim:[['[O Rui come|oração 1|n] [e|copulativa|conj] [a Ana bebe|oração 2|v].','O Rui come e a Ana bebe. Duas orações ligadas por e. Cada uma faz sentido sozinha.'],
['[Corri|oração 1|n], [mas|adversativa|conj] [perdi o autocarro|oração 2|v].','Corri, mas perdi o autocarro. Mas liga duas ideias contrárias: coordenação adversativa.'],
['[Choveu|oração 1|n], [por isso|conclusiva|conj] [fiquei em casa|oração 2|v].','Choveu, por isso fiquei em casa. A segunda oração é uma conclusão.']],

{id:'subordinacao',g:'oracoes',t:'Frase complexa: subordinação',sub:'Orações que dependem de outras',lv:'g',
ex:{k:'Às vezes uma parte da frase **depende** de outra. Em «Fiquei em casa **porque chovia**», a parte «porque chovia» explica a outra e não faz sentido sozinha.',
m:'Na **subordinação**, uma oração (a **subordinada**) depende de outra (a **subordinante**). A subordinada começa geralmente por uma conjunção ou por um pronome relativo. Exemplos: **causal** (Fiquei em casa porque chovia), **temporal** (Quando cheguei, já tinham saído), **final** (Estudo para que o teste corra bem), **condicional** (Se fizer sol, vamos à praia), **concessiva** (Embora estivesse cansado, fui treinar) e **relativa** (O livro que me deste é ótimo).',
g:'Orações subordinadas **adverbiais**: causal, temporal, final, condicional, concessiva, comparativa (Ele é mais alto do que eu pensava) e consecutiva (Estava tão cansado que adormeceu). **Substantivas**: **completivas**, com função de complemento ou de sujeito (Disse **que vinha**; Perguntei **se vinhas**), e **relativas sem antecedente** (**Quem espera** sempre alcança). **Adjetivas relativas**: **restritivas**, sem vírgulas, que restringem o antecedente (Os alunos **que estudaram** passaram), e **explicativas**, entre vírgulas, que acrescentam informação (Os alunos, **que estudaram**, passaram). Quando a subordinada adverbial vem antes da subordinante, separa-se por vírgula.'},
dica:'Tapa a oração que começa pela conjunção: se a parte que sobra faz sentido sozinha, é a subordinante.',
map:['Subordinadas',[['Adverbiais','causal, temporal, final, condicional…'],['Substantivas','completivas, relativas sem antecedente'],['Adjetivas','relativas restritivas e explicativas']]],
tabs:[{h:'Orações subordinadas adverbiais',c:['Tipo','Conectores','Exemplo'],r:[['Causal','porque, visto que, como','Saí cedo porque tinha aulas.'],['Temporal','quando, enquanto, assim que','Quando acabares, avisa.'],['Final','para que, a fim de que, para','Falei baixo para que não acordasse.'],['Condicional','se, caso, desde que','Se estudares, passas.'],['Concessiva','embora, ainda que, apesar de','Embora chovesse, saímos.'],['Comparativa','como, mais / menos… do que','Correu mais do que eu esperava.'],['Consecutiva','tão… que, de modo que','Riu tanto que chorou.']]},

anim:[['[Fiquei em casa|subordinante|n] [porque chovia|subordinada causal|conj].','Fiquei em casa porque chovia. Porque chovia depende da outra parte: é uma oração subordinada causal.'],
['[Se fizer sol|subordinada condicional|conj], [vamos à praia|subordinante|n].','Se fizer sol, vamos à praia. A condição vem primeiro e é separada por vírgula.'],
['O livro [que me deste|subordinada relativa|pro] é ótimo.','O livro que me deste é ótimo. A oração começa pelo pronome relativo que e diz de que livro se trata.'],

{id:'discurso',g:'frase',t:'Discurso direto e indireto',sub:'Contar o que alguém disse',lv:'m',
ex:{k:'Quando contamos o que alguém disse, podemos usar as **palavras exatas** da pessoa — é o **discurso direto** (O Rui disse: — Estou cansado.). Ou podemos **contar por palavras nossas** — é o **discurso indireto** (O Rui disse que estava cansado.).',
m:'No **discurso direto** reproduzem-se as palavras exatas das personagens, com **dois pontos** e **travessão** (ou aspas) e um **verbo declarativo** (dizer, perguntar, responder, exclamar…). No **discurso indireto**, o narrador conta o que foi dito: desaparece o travessão, aparece **que** ou **se**, e mudam as pessoas, os tempos verbais e algumas palavras (eu → ele; hoje → naquele dia; aqui → ali).',
g:'Na passagem do discurso direto para o indireto: o verbo declarativo introduz uma oração completiva (com **que**, ou com **se** nas perguntas totais; nas perguntas parciais mantém-se a palavra interrogativa: Perguntou **onde** eu morava); mudam as **pessoas** (eu → ele), os **possessivos** (meu → seu, dele), os **tempos verbais** (presente → imperfeito; perfeito → mais-que-perfeito; futuro → condicional), o **imperativo** passa a conjuntivo (— Sai! → Mandou que saísse) e mudam os **advérbios e demonstrativos** de tempo e lugar (hoje → naquele dia; amanhã → no dia seguinte; aqui → ali; este → aquele).'},
dica:'Imagina que és tu a contar a história a outra pessoa, mais tarde e noutro lugar: é isso que obriga a mudar «eu», «hoje» e «aqui».',
map:['Discurso',[['Direto','palavras exatas — dois pontos e travessão'],['Indireto','o narrador conta — que, se']]],
tabs:[{h:'Do direto para o indireto',c:['Discurso direto','Discurso indireto'],r:[['eu, nós','ele / ela, eles / elas'],['meu, nosso','seu, dele, deles'],['presente (estou)','pret. imperfeito (estava)'],['pret. perfeito (fiz)','mais-que-perfeito (tinha feito)'],['futuro (irei)','condicional (iria)'],['imperativo (sai!)','conjuntivo (que saísse)'],['hoje / ontem / amanhã','naquele dia / na véspera / no dia seguinte'],['aqui / este','ali, lá / aquele'],['agora','naquele momento']]}],
anim:[['O Rui disse: — [Eu|pessoa|pro] [estou|presente|v] cansado.','No discurso direto: o Rui disse, eu estou cansado. São as palavras exatas do Rui.'],
['O Rui disse [que|conjunção|conj] [estava|estou → estava|v] cansado.','No discurso indireto: o Rui disse que estava cansado. Estou passou a estava.'],
['— Vou [amanhã|amanhã|adv]. → Disse que ia [no dia seguinte|no dia seguinte|adv].','Amanhã passa a no dia seguinte.']],

q:[{t:'mc',p:'Discurso indireto de: O Rui disse: — Estou com fome.',o:['O Rui disse que estou com fome.','O Rui disse que estava com fome.','O Rui disse: estava com fome.'],a:1},
