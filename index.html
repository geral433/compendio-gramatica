{id:'colocacao',g:'frase',t:'Colocação do pronome',sub:'Vi-o ou não o vi?',lv:'m',
ex:{k:'Os pronomes **o, a, lhe, me, te**… costumam ir **depois do verbo**, ligados por hífen: **Vi-o**, **Dá-me**. Mas, se houver um **não** antes, passam para **antes do verbo**: **Não o vi.**',
m:'No português de Portugal, a regra geral é a **ênclise**: o pronome vem **depois** do verbo, com hífen (Dei-lhe o livro). Usa-se a **próclise** (pronome **antes** do verbo) quando há: palavras **negativas** (não, nunca, ninguém, nada) — Não te vi; alguns **advérbios** (já, ainda, também, só, sempre, talvez) — Já lhe disse; palavras **interrogativas** — Quem te disse?; e **orações subordinadas** (que, quando, se…) — Sei que o viste.',
g:'Regra geral: **ênclise** (Vi-o). **Próclise** com: negação, certos advérbios (já, ainda, também, só, sempre, talvez, bem), quantificadores como todos, alguém, ninguém, palavras interrogativas e exclamativas, e em orações subordinadas. No **futuro** e no **condicional**, sem motivo de próclise, usa-se a **mesóclise**: o pronome fica no meio do verbo (dar-te-ei, dir-lhe-ia). Os pronomes o, a, os, as mudam de forma: depois de -r, -s ou -z, essa letra cai e o pronome passa a **lo, la** (comprar + o → comprá-lo; fiz + o → fi-lo); depois de som nasal, passa a **no, na** (dão + o → dão-no). Combinações: lhe + o = **lho** (Dei-lho).'},
dica:'Procura «ímanes»: palavras como não, já, quem, que, nunca puxam o pronome para antes do verbo.',
map:['Pronome',[['Ênclise','depois — vi-o'],['Próclise','antes — não o vi'],['Mesóclise','no meio — vê-lo-ei']]],
tabs:[{h:'Onde fica o pronome?',c:['Posição','Quando','Exemplo'],r:[['Ênclise (depois)','regra geral','Vi-o ontem.'],['Próclise (antes)','não, nunca, ninguém…','Não o vi.'],['Próclise (antes)','já, ainda, também, só, sempre, talvez','Já o vi.'],['Próclise (antes)','perguntas com quem, onde, quando…','Quem o viu?'],['Próclise (antes)','orações com que, se, quando…','Disse que o viu.'],['Mesóclise (no meio)','futuro e condicional','Vê-lo-ei amanhã.']]},
{h:'Mudanças de forma',c:['Situação','Exemplo'],r:[['depois de -r, -s, -z → lo, la','comprar + o → comprá-lo'],['depois de som nasal → no, na','dão + a → dão-na'],['lhe + o','dei + lhe + o → dei-lho']]}],
anim:[['Vi-[o|depois do verbo|pro].','Vi-o. Normalmente, o pronome vai depois do verbo, ligado por hífen.'],
['[Não|negação|adv] [o|antes do verbo|pro] vi.','Não o vi. A palavra não puxa o pronome para antes do verbo.'],
['[Já|advérbio|adv] [te|antes do verbo|pro] disse.','Já te disse. Palavras como já, também ou sempre também puxam o pronome para a frente.'],
['dar-[te|no meio|pro]-ei','Dar-te-ei. No futuro, o pronome pode ficar no meio do verbo. Chama-se mesóclise.']],

{id:'vogais',g:'sons',t:'Vogais, ditongos e hiatos',sub:'Vogais orais e nasais, semivogais, encontros vocálicos',lv:'k',
ex:{k:'Quando duas vogais aparecem juntas, às vezes dizemo-las **de uma só vez** (pai, mãe, céu) e às vezes **em dois tempos** (sa-ú-de, pa-ís). Se ficam na mesma sílaba, formam um **ditongo**; se ficam em sílabas diferentes, formam um **hiato**.',
m:'As vogais podem ser **orais** (o ar sai só pela boca: lá, pé) ou **nasais** (o ar sai também pelo nariz: lã, campo, sim). Quando uma vogal e uma **semivogal** (um i ou u «fraco») se juntam na mesma sílaba, formam um **ditongo**: oral (pai, céu, fui) ou nasal (mãe, pão, põe). Quando duas vogais seguidas pertencem a sílabas diferentes, há um **hiato** (sa-ú-de, ru-a, pa-ís).',
g:'No português europeu distinguem-se vogais **orais** e **nasais**, **tónicas** e **átonas** (as átonas tendem a reduzir-se: em «pegar», o primeiro e quase não se ouve). As **semivogais** (escritas i/e e u/o) não formam sílaba sozinhas. **Ditongo**: vogal + semivogal na mesma sílaba, **decrescente** (pai, mau) ou **crescente** (quatro, água); pode ser **oral** (rei, céu) ou **nasal** (mãe, cão, muito). **Tritongo**: semivogal + vogal + semivogal na mesma sílaba (Uruguai, saguão). **Hiato**: duas vogais em sílabas diferentes (sa-ú-de, vo-o, ca-ir).'},
dica:'Diz a palavra devagar: se as duas vogais saem «num só golpe de voz», é ditongo; se tens de as separar, é hiato.',
map:['Encontros vocálicos',[['Ditongo','vogal + semivogal na mesma sílaba — pai, mãe'],['Tritongo','semivogal + vogal + semivogal — Uruguai'],['Hiato','vogais em sílabas diferentes — sa-ú-de']]],

{id:'processos',g:'sons',t:'Processos fonológicos',sub:'Como as palavras mudaram do latim ao português',lv:'s',
ex:{m:'As palavras mudam ao longo do tempo. Às vezes **ganham** sons (do latim stella veio **estrela**: ganhou um e no início), **perdem** sons (de mare veio **mar**) ou **trocam** sons (de lupu veio **lobo**: o p passou a b). Estas mudanças chamam-se **processos fonológicos**.',
g:'Os **processos fonológicos** explicam a evolução das palavras do latim para o português e algumas variações da fala. **Inserção**: **prótese** (no início: stella > estrela), **epêntese** (no meio: humile > humilde), **paragoge** (no fim: ante > antes). **Supressão**: **aférese** (no início: episcopu > bispo), **síncope** (no meio: malu > mau), **apócope** (no fim: mare > mar). **Alteração**: **sonorização** (lupu > lobo), **palatalização** (clave > chave), **assimilação** (persona > pessoa), **dissimilação** (anima > alma), **metátese** (semper > sempre), **vocalização** (nocte > noite), **nasalização** (mihi > mim), **crase** (dolore > door > dor), **ditongação** (arena > areia) e **monotongação** (auru > ouro).'},
dica:'Compara as duas formas letra a letra: o som foi acrescentado, apagado ou trocado? E onde — no início, no meio ou no fim?',

/* ================= LÉXICO ================= */
{id:'estrutura',g:'lexico',t:'Estrutura da palavra',sub:'Radical, afixos, vogal temática e desinências',lv:'m',
ex:{k:'Muitas palavras partem-se em **pedacinhos com significado**. Em **gat-inh-o** há o **radical** (gat), que diz o que é, e outros pedaços que acrescentam ideias (inh = pequeno; o = masculino).',
m:'A palavra pode ter vários **elementos**: o **radical** (a parte que se mantém e tem o significado principal: **cant**-ar, **cant**-or), os **afixos** (prefixos e sufixos, que formam palavras novas: **in**-feliz, feliz-**mente**) e as **desinências** (terminações que indicam género, número, pessoa e tempo: gat-**a**-**s**, canta-**mos**). Nos verbos há ainda a **vogal temática** (a, e, i), que mostra a conjugação: cant-**a**-r, com-**e**-r, part-**i**-r.',
g:'A palavra decompõe-se em **radical**, **afixos derivacionais** (prefixos e sufixos) e **constituintes flexionais**. O **tema** é o radical + **vogal temática** nos verbos (cant + a) ou **índice temático** nos nomes e adjetivos (mes + a, livr + o, dent + e). As **desinências** marcam género e número nos nomes e adjetivos (alun-**a**-**s**) e, nos verbos, **modo-tempo** e **pessoa-número** (cant-**á**-**va**-**mos**: va = pretérito imperfeito do indicativo; mos = 1.ª pessoa do plural). Palavras **variáveis** flexionam (nome, adjetivo, determinante, pronome, a maioria dos quantificadores, verbo); **invariáveis** não flexionam (advérbio, preposição, conjunção, interjeição).'},
dica:'Compara palavras da mesma família ou formas do mesmo verbo: a parte que se repete é o radical; o que muda são afixos ou desinências.',
map:['Palavra',[['Radical','significado principal — cant-'],['Afixos','prefixo e sufixo — in-, -mente'],['Vogal temática','conjugação — -a-, -e-, -i-'],['Desinências','género, número, tempo, pessoa — -s, -mos']]],

['[gat|radical|n][a|género|q][s|número|v]','Gatas: o a marca o feminino e o s marca o plural. São desinências.'],
['[cant|radical|n][á|vogal temática|det][va|tempo|v][mos|pessoa|pro]','Cantávamos: radical cant, vogal temática a, va indica o pretérito imperfeito e mos indica nós.']],

{id:'significado',g:'lexico',t:'Significado das palavras',sub:'Denotação, conotação, polissemia',lv:'m',
ex:{k:'Uma palavra pode ter **mais do que um significado**. **Folha** pode ser a folha da árvore ou a folha do caderno. Para perceber qual é, olhamos para a frase.',
m:'O **sentido denotativo** é o sentido próprio, de dicionário (A pedra caiu no rio). O **sentido conotativo** é um sentido figurado, que depende do contexto (Ele tem um coração **de pedra** = é insensível). Uma palavra com vários sentidos relacionados é **polissémica** (folha, cabeça, cabo); uma palavra com um só sentido é **monossémica** (sobretudo termos científicos: fotossíntese). É o **contexto** que nos ajuda a escolher o sentido certo.',
g:'Distinguem-se **denotação** (sentido literal e estável) e **conotação** (sentidos associados, figurados ou afetivos, que dependem do contexto e da cultura). **Polissemia**: uma palavra com vários significados relacionados entre si (cabeça: do corpo, da lista, do grupo). Distingue-se da **homonímia**, em que palavras diferentes coincidem na forma sem relação de sentido (são = santo; são = saudável; são = forma de ser). **Monossemia**: um só significado, típica da terminologia científica e técnica. O **campo semântico** de uma palavra reúne os seus vários sentidos.'},
dica:'Se conseguires trocar a palavra por uma explicação «de dicionário» sem estragar a frase, o sentido é denotativo; se não, é conotativo.',
map:['Sentido',[['Denotativo','próprio, literal'],['Conotativo','figurado'],['Polissemia','vários sentidos ligados — folha'],['Monossemia','um só sentido — fotossíntese']]],

{id:'origem',g:'lexico',t:'Origem e evolução das palavras',sub:'Latim, empréstimos, arcaísmos e neologismos',lv:'g',
ex:{m:'A maioria das palavras portuguesas vem do **latim**. Outras chegaram de outras línguas: do árabe (azeite, almofada, alface), do francês (garagem, abajur), do inglês (futebol, internet)… Há palavras que deixaram de se usar (**arcaísmos**: asinha, que queria dizer depressa) e palavras novas que vão surgindo (**neologismos**: teletrabalho).',
g:'O português é uma língua **românica**, derivada do latim vulgar. Muitas palavras evoluíram pela **via popular**, sofrendo processos fonológicos (oculu > olho), e outras entraram mais tarde pela **via erudita**, quase sem alterações (ocular). Daí as **palavras divergentes**: o mesmo étimo deu duas palavras (plenu > cheio / pleno). **Palavras convergentes**: étimos diferentes deram a mesma forma (sanu, sanctu e sunt > são). **Empréstimos** vieram de outras línguas — árabe (azeite, alface), francês (garagem, abajur), inglês (futebol, stress), italiano (piano, soneto). Os **estrangeirismos** mantêm a forma original (marketing, croissant). Os **arcaísmos** caíram em desuso (asinha); os **neologismos** são palavras novas (teletrabalho, desconfinar).'},
dica:'Palavra muito parecida com o latim? Provavelmente entrou pela via erudita. Muito transformada? Veio pela via popular.',
map:['Léxico',[['Origem latina','via popular e via erudita'],['Empréstimos','árabe, francês, inglês…'],['Arcaísmos','palavras antigas'],['Neologismos','palavras novas']]],

/* ================= SINTAXE: FRASE SIMPLES ================= */
{id:'grupos',g:'frase',t:'Grupos de palavras',sub:'Nominal, verbal, adjetival, adverbial, preposicional',lv:'m',
ex:{k:'As palavras de uma frase juntam-se em **grupos**. Em «**O meu gato** **come peixe**», há um grupo à volta do nome gato e outro à volta do verbo come.',
m:'Uma frase organiza-se em **grupos** de palavras, cada um com uma palavra principal, o **núcleo**: **grupo nominal** (núcleo: nome ou pronome — o meu gato preto), **grupo verbal** (núcleo: verbo — come peixe ao almoço), **grupo adjetival** (núcleo: adjetivo — muito alto), **grupo adverbial** (núcleo: advérbio — muito depressa) e **grupo preposicional** (começa por preposição — no jardim, de música).',
g:'Os **constituintes** da frase identificam-se por testes: **substituição** (um grupo nominal pode trocar por um pronome: O meu gato → Ele), **movimento** (o grupo desloca-se em bloco: No jardim, brinquei), **pergunta** (o grupo responde a uma pergunta: Onde brincaste? — No jardim) e **coordenação**. A frase simples divide-se em **GN** (sujeito) e **GV** (predicado). O GV contém o verbo e os seus complementos e modificadores; o **GPrep** é formado por preposição + GN (de + o jardim); o **GAdj** e o **GAdv** podem ter modificadores (muito, bastante).'},
dica:'Se um conjunto de palavras pode ser trocado por «ele», «isso» ou «lá», ou mudar de lugar todo junto, é um grupo.',
map:['Frase',[['Grupo nominal','o meu gato'],['Grupo verbal','come peixe ao almoço',[['Grupo preposicional','ao almoço']]],['Grupo adjetival','muito alto'],['Grupo adverbial','bastante cedo']]],
tabs:[{h:'Grupos e núcleos',c:['Grupo','Núcleo','Exemplo'],r:[['Nominal (GN)','nome ou pronome','o meu [gato] preto'],['Verbal (GV)','verbo','[come] peixe'],['Adjetival (GAdj)','adjetivo','muito [alto]'],['Adverbial (GAdv)','advérbio','muito [depressa]'],['Preposicional (GPrep)','preposição + GN','[em] + o jardim']]},
{h:'Testes de constituintes',c:['Teste','Exemplo'],r:[['Substituição','O meu gato dorme → Ele dorme.'],['Movimento','Brinquei no jardim → No jardim, brinquei.'],['Pergunta','Onde brincaste? — No jardim.']]}],
anim:[['[O meu gato|grupo nominal|n] [come peixe|grupo verbal|v].','O meu gato come peixe. Dois grandes grupos: o grupo nominal, o meu gato, e o grupo verbal, come peixe.'],
['o meu [gato|núcleo|n] preto','Em o meu gato preto, a palavra principal é gato. É o núcleo do grupo nominal.'],
['Brinquei [no jardim|grupo preposicional|prep].','No jardim começa por uma preposição: é um grupo preposicional.'],
['[Ele|substitui o GN|pro] come peixe.','Ele come peixe. Se podemos trocar por ele, encontrámos um grupo nominal.']],

{id:'cdci',g:'frase',t:'Complemento direto e indireto',sub:'O quê? A quem? Testes com pronomes',lv:'m',
ex:{k:'O **complemento direto** diz **o quê** ou **quem**: «Comi **uma maçã**.» O **complemento indireto** diz **a quem**: «Dei a maçã **à Ana**.»',
m:'O **complemento direto** (CD) é pedido por verbos transitivos diretos e responde a «o quê?» ou «quem?»: Li **um livro**; Vi **o Pedro**. Substitui-se pelos pronomes **o, a, os, as**: Li-**o**; Vi-**o**. O **complemento indireto** (CI) indica o destinatário: é introduzido pela preposição **a** e substitui-se por **lhe, lhes**: Escrevi **ao avô** → Escrevi-**lhe**. Um verbo pode pedir os dois: Dei **um presente** (CD) **à Inês** (CI) → Dei-**lho**.',
g:'O **CD** é selecionado por verbos transitivos diretos (e transitivos diretos e indiretos) e pode ser um GN (Comprei pão), uma oração completiva (Disse que vinha) ou, raramente, um GPrep com «a» (Amar a Deus). Testes: substituição por **o, a, os, as** e passagem a **sujeito na passiva** (O pão foi comprado). O **CI** é um GPrep introduzido por «a» que se substitui por **lhe, lhes**; com dois pronomes, combinam-se: lhe + o = **lho**, lhe + a = **lha**. Atenção: nem todo o grupo com «a» é CI — «Vou **a Lisboa**» não aceita «lhe» (é complemento oblíquo).'},
dica:'Faz o teste do pronome: se trocas por «o/a», é CD; se trocas por «lhe», é CI. Se não dá nenhum, procura outra função.',
map:['Complementos',[['Direto','o quê? quem? → o, a, os, as'],['Indireto','a quem? → lhe, lhes']]],
tabs:[{h:'Testes',c:['Função','Pergunta','Pronome','Exemplo'],r:[['CD','o quê? / quem?','o, a, os, as','Comi [a sopa] → Comi-a.'],['CI','a quem?','lhe, lhes','Telefonei [à avó] → Telefonei-lhe.'],['CD + CI','—','lho, lha, lhos, lhas','Dei [o livro] [ao Rui] → Dei-lho.']]},

{id:'obliquo',g:'frase',t:'Complemento oblíquo e agente da passiva',sub:'Gosto de…, moro em…, foi feito por…',lv:'m',
ex:{k:'Alguns verbos pedem uma parte da frase que começa por uma preposição: «Gosto **de chocolate**.» «Moro **em Braga**.» Sem ela, a frase fica incompleta. É o **complemento oblíquo**.',
m:'O **complemento oblíquo** é pedido pelo verbo, começa normalmente por uma preposição e **não se substitui por lhe**: Gosto **de música**; Preciso **de ajuda**; Moro **em Faro**; Vou **ao cinema**; Pus o livro **na mesa**. Se o tirarmos, a frase fica incompleta (Moro… onde?). O **complemento agente da passiva** aparece na voz passiva e indica quem pratica a ação; é introduzido por **por** (pelo, pela…): O quadro foi pintado **pelo artista**.',
g:'O **complemento oblíquo** é selecionado pelo verbo (é obrigatório) e pode ser um GPrep (Gosto de ti), um GAdv (Moro aqui; Ele portou-se bem) ou uma oração (Lembro-me de que era feriado). Distingue-se do **CI** porque não aceita «lhe» (Vou a Lisboa → *Vou-lhe) e do **modificador** porque não pode ser omitido. Pedem oblíquo verbos de movimento (ir, vir, chegar), de localização (morar, viver), pôr, colocar, gostar, precisar, depender, tratar de, entre outros. O **complemento agente da passiva** é um GPrep com «por» que, na frase ativa correspondente, é o sujeito: O bolo foi feito **pela avó** ← A avó fez o bolo.'},
dica:'Tira a parte da frase: se a frase fica «coxa» e não dá para trocar por «lhe», é complemento oblíquo.',

{id:'predicativos',g:'frase',t:'Predicativo do sujeito e do complemento direto',sub:'É simpático, acho-o divertido',lv:'m',
ex:{k:'Com verbos como **ser**, **estar**, **ficar** e **parecer**, dizemos **como é** o sujeito: «A sopa **está quente**.» «O Rui **é simpático**.» A palavra que caracteriza o sujeito é o **predicativo do sujeito**.',
m:'O **predicativo do sujeito** aparece com **verbos copulativos** (ser, estar, ficar, parecer, permanecer, continuar, tornar-se) e atribui uma característica ou um estado ao sujeito: O céu **está nublado**; A Rita **é professora**. O **predicativo do complemento direto** caracteriza o CD e aparece com verbos como achar, considerar, eleger, nomear, tornar, deixar: Acho o filme **divertido**; Elegeram a Ana **delegada**.',
g:'O **predicativo do sujeito** é selecionado por um verbo copulativo e pode ser um GAdj (é alto), um GN (é médico), um GPrep (é de Lisboa; está com fome) ou um GAdv (está bem). Quando variável, concorda com o sujeito (As meninas estão cansadas). O **predicativo do complemento direto** é selecionado por verbos **transitivos-predicativos** (achar, considerar, julgar, eleger, nomear, tornar, deixar): Considero essa decisão **injusta**. Teste: ao pronominalizar o CD, o predicativo mantém-se — Considero-a **injusta**. Não o confundas com o **modificador restritivo do nome**: em «Comprei um carro novo» → «Comprei-o», «novo» desaparece com o CD.'},
dica:'Com ser, estar, ficar ou parecer, o que vem a seguir a caracterizar o sujeito é o predicativo do sujeito.',
map:['Predicativos',[['Do sujeito','com ser, estar, ficar, parecer — A Ana é alta'],['Do complemento direto','com achar, considerar, eleger — Acho o jogo fácil']]],
tabs:[{h:'Verbos copulativos',c:['Verbo','Exemplo'],r:[['ser','O Tejo é [longo].'],['estar','A água está [fria].'],['ficar','O Rui ficou [contente].'],['parecer','Pareces [cansado].'],['continuar / permanecer','A loja continua [fechada].'],['tornar-se','Tornou-se [famoso].']]},

['A sopa [está|copulativo|v] [quente|predicativo do sujeito|adj].','A sopa está quente. Quente diz como está a sopa.'],

['Acho-[o|CD|det] [divertido|mantém-se|adj].','Acho-o divertido. Mesmo com o pronome, divertido continua lá: é o predicativo do complemento direto.']],

{id:'modificadores',g:'frase',t:'Modificadores',sub:'Do grupo verbal e de frase',lv:'m',
ex:{k:'Algumas partes da frase dão informação **extra**: quando, onde, como. Podemos tirá-las e a frase continua certa. «**Ontem**, brinquei **no parque**.» → «Brinquei.»',
m:'O **modificador** é uma informação acessória: não é pedida pelo verbo e pode ser retirada. O **modificador do grupo verbal** indica tempo, lugar, modo, causa ou fim: Jantámos **cedo**; Brincámos **no jardim**; Estudou **com atenção**. O **modificador de frase** refere-se à frase toda, muitas vezes no início e com vírgula: **Felizmente**, ninguém se magoou; **Na minha opinião**, o filme é ótimo.',
g:'Os **modificadores** não são selecionados pelo núcleo e são, em geral, omissíveis e móveis. **Modificador do grupo verbal**: GAdv (correu rapidamente), GPrep (saiu de manhã) ou oração subordinada adverbial (Saí quando parou de chover). **Modificador de frase**: advérbios e expressões que exprimem a atitude do locutor ou enquadram a frase (Felizmente, Sinceramente, Na verdade) e algumas orações, como condicionais e concessivas (Se chover, …). No grupo nominal há também **modificadores do nome** (restritivo e apositivo), estudados no tema «Funções no grupo nominal».'},
dica:'Tira a expressão: se a frase continua completa e com o mesmo sentido principal, era um modificador.',
map:['Modificadores',[['Do grupo verbal','tempo, lugar, modo — jantámos cedo'],['De frase','atitude de quem fala — Felizmente, …'],['Do nome','restritivo e apositivo']]],

{id:'gnominal',g:'frase',t:'Funções no grupo nominal e adjetival',sub:'Complemento do nome, modificadores do nome, complemento do adjetivo',lv:'g',
ex:{m:'Dentro de um grupo nominal também há funções. O **modificador restritivo do nome** especifica o nome, sem vírgulas: o livro **azul**; a casa **da avó**. O **modificador apositivo do nome** acrescenta uma explicação, entre vírgulas: Lisboa, **capital de Portugal**, é bonita. O **complemento do nome** é pedido pelo nome: o medo **do escuro**; a construção **da ponte**. O **complemento do adjetivo** é pedido pelo adjetivo: cheio **de água**; amigo **dos animais**.',
g:'No grupo nominal: **complemento do nome** — selecionado pelo nome, sobretudo nomes derivados de verbos ou adjetivos e nomes de relação (a destruição **da cidade**, a vontade **de ganhar**, o pai **da Ana**); **modificador restritivo do nome** — restringe a referência, sem pausas (o carro **vermelho**, o rapaz **que chegou**); **modificador apositivo do nome** — acrescenta informação não restritiva, entre vírgulas (O Rui, **o meu vizinho**, …; O Porto, **que é uma cidade antiga**, …). No grupo adjetival: **complemento do adjetivo** — selecionado pelo adjetivo (apto **para o cargo**, fiel **aos amigos**, orgulhoso **do filho**).'},
dica:'Vírgulas à volta? Provavelmente é modificador apositivo. É o nome que «pede» (medo de quê? destruição de quê?)? É complemento do nome.',
map:['Funções dentro de grupos',[['Grupo nominal','',[['Complemento do nome','o medo do escuro'],['Modificador restritivo','o livro azul'],['Modificador apositivo','Lisboa, capital de Portugal,']]],['Grupo adjetival','',[['Complemento do adjetivo','cheio de água']]]]],

{id:'concordancia',g:'frase',t:'Concordância',sub:'Nominal e verbal; casos difíceis',lv:'m',
ex:{k:'As palavras de uma frase **combinam** umas com as outras. Se o nome está no plural, o adjetivo e o verbo também ficam: «Os gatos **pretos** **dormem**.»',
m:'Na **concordância nominal**, determinantes, quantificadores e adjetivos concordam em género e número com o nome (as casas antigas). Na **concordância verbal**, o verbo concorda em pessoa e número com o sujeito (Tu cantas; Eles cantam). Atenção a estes casos: com sujeito composto, o verbo vai para o plural (A Ana e o Rui chegaram); o sujeito pode vir depois do verbo (Chegaram os convidados); **haver** com o sentido de existir fica sempre no singular (Há muitas pessoas; Havia problemas).',
g:'Concordância nominal: determinantes, quantificadores e adjetivos concordam com o núcleo do GN; se o adjetivo se refere a nomes de géneros diferentes, prevalece o masculino plural (camisa e casaco novos). Concordância verbal: o verbo concorda com o núcleo do sujeito; com sujeito composto vai para o plural, prevalecendo a 1.ª pessoa sobre as outras (Tu e eu vamos) e, entre 2.ª e 3.ª, usando-se correntemente a 3.ª do plural (Tu e ele vão). Casos especiais: **haver** existencial e **fazer** temporal são impessoais (Há dúvidas; Faz dois anos); com «a maioria de», «grande parte de» + plural, aceitam-se singular e plural (A maioria dos alunos chegou / chegaram); o predicativo do sujeito concorda com o sujeito (As portas estão abertas).'},
dica:'Encontra primeiro o núcleo do sujeito e pergunta: é singular ou plural? O verbo tem de acompanhar.',
map:['Concordância',[['Nominal','género e número — as casas antigas'],['Verbal','pessoa e número — eles cantam']]],
tabs:[{h:'Regras de concordância',c:['Caso','Correto','Errado'],r:[['Sujeito plural','Os meninos brincam.','Os meninos brinca.'],['Sujeito composto','A Ana e o Rui chegaram.','A Ana e o Rui chegou.'],['Haver = existir','Há muitas dúvidas.','Hão muitas dúvidas.'],['Haver no passado','Havia problemas.','Haviam problemas.'],['Fazer (tempo)','Faz três anos.','Fazem três anos.'],['Sujeito depois do verbo','Chegaram as cartas.','Chegou as cartas.']]}],
anim:[['[Os|plural|det] [gatos|plural|n] [pretos|plural|adj] [dormem|plural|v].','Os gatos pretos dormem. Tudo no plural: as palavras combinam.'],
['[A Ana e o Rui|sujeito composto|n] [chegaram|plural|v].','A Ana e o Rui chegaram. Há dois núcleos no sujeito: o verbo vai para o plural.'],
['[Há|singular|v] muitas pessoas.','Há muitas pessoas. Quando haver quer dizer existir, fica sempre no singular.']],
exs:['[Havia|singular] muitos carros na rua.','[Faz|singular] dois anos que nos conhecemos.','As janelas estão [abertas|concorda com «janelas»].'],

{id:'adverbiais',g:'oracoes',t:'Orações subordinadas adverbiais',sub:'Causais, temporais, finais, condicionais, concessivas, comparativas, consecutivas',lv:'g',
ex:{k:'Algumas orações dizem **porquê**, **quando** ou **para quê** acontece outra coisa: «Fiquei em casa **porque chovia**.» «**Quando acabares**, avisa.»',
m:'As **orações subordinadas adverbiais** funcionam como um advérbio: dizem **quando**, **porquê**, **para quê**, **em que condição**… em relação à oração subordinante. Podem vir antes ou depois dela; quando vêm antes, separam-se por vírgula: **Quando chegares**, avisa. Tipos: causal, temporal, final, condicional, concessiva, comparativa e consecutiva.',
g:'As adverbiais desempenham normalmente a função de **modificador**. Classificação: **causal** (porque, visto que, como, já que — Como estava frio, ficámos), **temporal** (quando, enquanto, assim que, mal, antes que, depois que), **final** (para que, a fim de que; para + infinitivo), **condicional** (se, caso, desde que, a menos que), **concessiva** (embora, ainda que, mesmo que, se bem que; apesar de + infinitivo), **comparativa** (como, tal como, mais / menos… do que, tão… como) e **consecutiva** (tão / tanto / tal… que, de modo que). Muitas pedem o **conjuntivo** (embora chova, para que saibas, caso venhas). Podem ser **finitas** (com verbo conjugado) ou **não finitas**, com infinitivo, gerúndio ou particípio (Ao sair, fecha a porta — temporal; Estando doente, faltou — causal).'},
dica:'Faz a pergunta certa à oração subordinante: porquê? quando? para quê? em que condição? apesar de quê? com que consequência?',
map:['Adverbiais',[['Causal','porque'],['Temporal','quando'],['Final','para que'],['Condicional','se'],['Concessiva','embora'],['Comparativa','como, do que'],['Consecutiva','tão… que']]],
tabs:[{h:'Classificação',c:['Tipo','Pergunta','Conectores','Exemplo'],r:[['Causal','porquê?','porque, como, visto que, já que','Não saí porque chovia.'],['Temporal','quando?','quando, enquanto, assim que, mal','Mal chegou, adormeceu.'],['Final','para quê?','para que, a fim de que','Explico-te para que percebas.'],['Condicional','em que condição?','se, caso, desde que, a menos que','Caso chova, ficamos.'],['Concessiva','apesar de quê?','embora, ainda que, mesmo que','Embora chovesse, saímos.'],['Comparativa','comparado com quê?','como, mais… do que','Correu mais do que eu esperava.'],['Consecutiva','com que consequência?','tão… que, de modo que','Falou tão baixo que ninguém ouviu.']]},

{id:'substantivas',g:'oracoes',t:'Orações subordinadas substantivas',sub:'Completivas e relativas sem antecedente',lv:'g',
ex:{k:'Às vezes uma oração inteira faz o papel de uma coisa: «Disse **que vinha**.» A parte «que vinha» é **o que** ele disse.',
m:'As **orações subordinadas substantivas** funcionam como um nome: podem ser o **sujeito** ou o **complemento** de outra oração. As **completivas** começam por **que** ou **se**: Disse **que vinha** (= disse isso); Pergunto-te **se queres vir**. As **relativas sem antecedente** começam por **quem**, **onde**, **o que**…: **Quem espera** sempre alcança.',
g:'As **substantivas completivas** são introduzidas pelas conjunções **que** e **se** (ou têm a forma de infinitivo: Quero **sair**) e desempenham funções como **sujeito** (É importante **que estudes**), **complemento direto** (Sei **que tens razão**), **complemento oblíquo** (Lembrei-me **de que era feriado**) ou **complemento do adjetivo / do nome** (Estou certo **de que vais conseguir**). Teste: substituir a oração por «isso» (Sei isso). As **substantivas relativas** (sem antecedente) são introduzidas por **quem**, **o que**, **onde**, **quanto** e funcionam como sujeito ou complemento (Convidei **quem quis**; Gosto **de quem é sincero**).'},
dica:'Troca a oração por «isso». Se a frase continuar a fazer sentido, a oração é substantiva.',

{id:'relativas',g:'oracoes',t:'Orações subordinadas adjetivas relativas',sub:'Restritivas e explicativas',lv:'g',
ex:{k:'Algumas orações dizem **qual** é a coisa de que falamos: «O livro **que li** era ótimo.» A parte «que li» diz que livro é.',
m:'As **orações relativas** funcionam como um adjetivo: dizem algo sobre um nome que vem antes (o **antecedente**). Começam por uma palavra relativa (**que**, **quem**, **o qual**, **cujo**, **onde**): O livro **que li** era ótimo. Podem ser **restritivas** (sem vírgulas: dizem qual é) ou **explicativas** (entre vírgulas: acrescentam uma explicação).',
g:'As **adjetivas relativas** são introduzidas por **pronomes relativos** (que; quem, precedido de preposição; o qual, a qual…), pelo **determinante relativo** cujo ou pelo **advérbio relativo** onde, e retomam um antecedente. **Restritivas**: restringem a referência do antecedente e não têm vírgulas (Os alunos **que estudaram** passaram — só esses). **Explicativas**: acrescentam informação sobre um antecedente já identificado e ficam entre vírgulas (Os alunos, **que estudaram**, passaram — todos estudaram). Funcionam, respetivamente, como **modificador restritivo** e **modificador apositivo do nome**. A palavra relativa tem uma função dentro da relativa: O livro **que** li (CD); O amigo **a quem** escrevi (CI); A casa **onde** moro (oblíquo).'},
dica:'Com vírgulas, a relativa explica (podes tirá-la e o nome continua identificado). Sem vírgulas, diz «qual».',
map:['Relativas',[['Restritivas','sem vírgulas — dizem qual'],['Explicativas','entre vírgulas — acrescentam informação']]],
tabs:[{h:'Restritiva ou explicativa?',c:['Restritiva','Explicativa'],r:[['Os alunos que estudaram passaram. (só alguns estudaram)','Os alunos, que estudaram, passaram. (todos estudaram)'],['sem vírgulas','entre vírgulas'],['modificador restritivo do nome','modificador apositivo do nome']]},

{id:'deixis',g:'texto',t:'Dêixis',sub:'Deíticos pessoais, temporais e espaciais',lv:'m',
ex:{k:'Algumas palavras só se percebem se soubermos **quem fala**, **onde** e **quando**: **eu**, **tu**, **aqui**, **hoje**, **amanhã**, **este**. Se encontrares um bilhete que diz «**Eu** volto **amanhã**», não sabes quem é «eu» nem que dia é «amanhã»!',
m:'A **dêixis** é a forma como a língua aponta para a situação de comunicação. Os **deíticos** são palavras cujo sentido depende de quem fala, de onde e de quando. Há três tipos: **pessoal** (eu, tu, nós, meu, teu e as terminações verbais: canto, cantas), **temporal** (agora, hoje, ontem, amanhã e os tempos verbais) e **espacial** (aqui, aí, ali, este, esse, aquele, vir, ir).',
g:'A **dêixis** relaciona o enunciado com as coordenadas da enunciação: o **eu**, o **aqui** e o **agora** do locutor. **Dêixis pessoal**: pronomes pessoais e possessivos de 1.ª e 2.ª pessoa, desinências verbais, vocativos e **formas de tratamento** (você, o senhor — dêixis social). **Dêixis temporal**: advérbios e expressões (agora, ontem, na próxima semana) e **tempos verbais**, que situam a ação em relação ao momento da fala. **Dêixis espacial**: advérbios (aqui, aí, ali, cá, lá), demonstrativos (este — perto do locutor; esse — perto do interlocutor; aquele — longe de ambos) e verbos de movimento (vir, trazer — em direção ao locutor; ir, levar — afastamento). Na passagem ao discurso indireto os deíticos mudam (hoje → naquele dia; aqui → ali), porque muda a situação de enunciação. Não confundas dêixis com **anáfora**: na anáfora, a palavra retoma algo do próprio texto.'},
dica:'Pergunta: «Para perceber esta palavra preciso de saber quem fala, onde ou quando?» Se sim, é um deítico.',
map:['Dêixis',[['Pessoal','eu, tu, nós, meu, -mos'],['Temporal','hoje, ontem, agora, tempos verbais'],['Espacial','aqui, ali, este, aquele, vir/ir']]],

['[Eu|pessoal|pro] · [hoje|temporal|adv] · [aqui|espacial|q]','Eu é um deítico pessoal, hoje é temporal e aqui é espacial.'],

{id:'aspeto',g:'texto',t:'Valor temporal e aspetual',sub:'Quando acontece e como decorre',lv:'s',
ex:{m:'Os verbos mostram **quando** acontece uma ação (**valor temporal**: passado, presente, futuro) e também **como** decorre (**valor aspetual**): se está **acabada** (Li o livro), **a decorrer** (Estou a ler), se é **habitual** (Leio todas as noites) ou se é uma **verdade geral** (A água ferve a 100 graus).',
g:'O **valor temporal** situa a situação descrita em relação ao momento da enunciação: **anterioridade** (passado), **simultaneidade** (presente) ou **posterioridade** (futuro). O tempo gramatical nem sempre coincide com o valor temporal — «Amanhã vou ao cinema» (presente com valor de futuro); «Em 1500, Cabral chega ao Brasil» (presente histórico). O **valor aspetual** indica como a situação decorre: **perfetivo** (situação concluída: Escrevi a carta), **imperfetivo** (situação em curso: Escrevia a carta; Estou a escrever), **habitual** (Escrevo-lhe todos os dias), **iterativo** (repetição: Tem escrito muitas cartas) e **genérico** (verdades gerais: A água ferve a 100 °C). Contribuem para o aspeto os tempos verbais, as perífrases (estar a, andar a, começar a, acabar de, continuar a) e os advérbios (sempre, frequentemente).'},
dica:'Pergunta: a ação acabou? está a decorrer? repete-se? é sempre verdade?',
map:['Valores',[['Temporal','anterioridade, simultaneidade, posterioridade'],['Aspetual','perfetivo, imperfetivo, habitual, iterativo, genérico']]],

{id:'modalidade',g:'texto',t:'Modalidade',sub:'Epistémica, deôntica e apreciativa',lv:'s',
ex:{m:'Quando falamos, mostramos a nossa **atitude** sobre o que dizemos: se temos **certeza** ou **dúvida** (Talvez chova; Com certeza chove), se é uma **obrigação** ou uma **permissão** (Tens de estudar; Podes sair) ou se **gostamos** ou não (Felizmente, ganhámos). A isto chama-se **modalidade**.',
g:'A **modalidade** exprime a atitude do locutor face ao que diz. **Epistémica**: grau de certeza ou conhecimento — certeza (Certamente virá), probabilidade (Deve estar a chover; Provavelmente…), possibilidade ou dúvida (Pode ser verdade; Talvez…). **Deôntica**: obrigação (Tens de / Deves estudar; É obrigatório…) ou permissão (Podes sair; É permitido…). **Apreciativa**: avaliação (Felizmente; Que pena…; É ótimo que…). Marcadores: verbos modais (dever, poder, ter de), advérbios (talvez, certamente, felizmente), modos verbais (conjuntivo, condicional), adjetivos (possível, necessário) e o tipo de frase. Atenção: «dever» e «poder» podem ter valor epistémico (Deve estar em casa = provavelmente) ou deôntico (Deves estar em casa às dez = obrigação).'},
dica:'Pergunta: quem fala mostra certeza ou dúvida (epistémica)? obriga ou permite (deôntica)? avalia ou mostra sentimento (apreciativa)?',

{id:'atos',g:'texto',t:'Atos de fala',sub:'Assertivos, diretivos, compromissivos, expressivos, declarativos',lv:'s',
ex:{m:'Quando falamos, **fazemos coisas** com as palavras: informamos, pedimos, prometemos, agradecemos… Cada uma destas ações é um **ato de fala**. «Está frio» pode ser só uma informação ou um pedido para fecharem a janela!',
g:'Ao falar, realizamos ações: são os **atos de fala** (atos ilocutórios). **Assertivos**: o locutor apresenta algo como verdadeiro (informar, afirmar, descrever — A reunião é às 10 h). **Diretivos**: procura que o interlocutor faça algo (pedir, ordenar, aconselhar, perguntar — Fecha a porta; Podes ajudar-me?). **Compromissivos**: o locutor compromete-se (prometer, jurar, oferecer-se — Amanhã ajudo-te). **Expressivos**: exprime um estado psicológico (agradecer, pedir desculpa, felicitar — Obrigado!; Parabéns!). **Declarativos**: alteram a realidade quando ditos por quem tem autoridade (Declaro aberta a sessão). Um ato é **direto** quando a forma corresponde à intenção (Fecha a janela) e **indireto** quando não corresponde (Está tanto frio aqui… = pedido para fechar a janela).'},
dica:'Pergunta: com esta frase, o que é que quem fala quer FAZER? Informar, pedir, prometer, agradecer ou declarar?',

{id:'cortesia',g:'texto',t:'Formas de tratamento e cortesia',sub:'Tu, você, o senhor; pedir com delicadeza',lv:'k',
ex:{k:'Falamos de forma diferente com um amigo e com uma pessoa que não conhecemos. Ao amigo dizemos «**Tu** queres?»; a um adulto desconhecido, «**O senhor** quer?». Dizer «**por favor**» e «**obrigado**» também é cortesia.',
m:'As **formas de tratamento** mostram a relação entre quem fala e quem ouve. Usamos **tu** com família, amigos e colegas (tratamento informal) e **o senhor / a senhora**, **o professor / a doutora**, ou só a 3.ª pessoa do verbo (Quer um café?) em situações formais. Em Portugal, «**você**» usa-se com alguma familiaridade, mas pode soar pouco delicado em contextos formais. A **cortesia** inclui fórmulas como **por favor**, **obrigado/a**, **com licença**, **desculpe**, e o uso do condicional ou do imperfeito para suavizar pedidos: **Podia** ajudar-me? **Queria** um café.',
g:'As formas de tratamento são **deíticos sociais**: codificam a relação de proximidade, hierarquia ou idade entre interlocutores. O português europeu tem um sistema rico: **tu** (informal); **você** (semiformal, de uso delicado); **o senhor / a senhora**, **o senhor doutor**, **a senhora professora** (formal); títulos e cargos (Vossa Excelência, Senhor Presidente). É frequente omitir o pronome e usar só a 3.ª pessoa verbal (Já almoçou?). A **cortesia linguística** relaciona-se com o **princípio de cooperação** — dar a informação necessária (quantidade), verdadeira (qualidade), relevante (relação) e clara (modo) — e com estratégias para não ferir o interlocutor: atos indiretos, condicional e imperfeito de cortesia (Gostaria de…, Queria…) e atenuadores (se não se importa, só um momento).'},
dica:'Antes de falar, pensa: quem é a pessoa? Conheço-a bem? É mais velha ou tem um cargo? Isso decide a forma de tratamento.',
map:['Tratamento',[['Informal','tu — amigos, família'],['Semiformal','você — com cuidado'],['Formal','o senhor, a senhora, o professor']]],
tabs:[{h:'Formas de tratamento',c:['Situação','Forma','Exemplo'],r:[['Amigos, família, colegas','tu','Queres vir comigo?'],['Pessoa mais velha ou desconhecida','o senhor / a senhora','A senhora precisa de ajuda?'],['Profissão ou cargo','o professor, a doutora','O professor pode repetir?'],['Sem pronome (formal)','3.ª pessoa','Já conhece a escola?'],['Muito formal','Vossa Excelência','Vossa Excelência permite…']]},

{id:'coesao',g:'texto',t:'Coesão textual',sub:'Anáfora, catáfora, conectores e coerência',lv:'g',
ex:{k:'Num texto, as frases **ligam-se** umas às outras. Para não repetir, usamos palavras como **ele** ou **ela**: «A Ana chegou. **Ela** vinha cansada.» E usamos palavras como **depois** ou **por isso** para ligar ideias.',
m:'Um texto não é um monte de frases soltas: as frases **ligam-se** umas às outras. Para isso usamos **pronomes** e **sinónimos** para não repetir (A Ana chegou. **Ela** vinha cansada.), **conectores** que ligam ideias (**primeiro**, **depois**, **por isso**, **no entanto**) e tempos verbais que combinam entre si.',
g:'A **coesão** é a ligação linguística entre as partes do texto. **Coesão gramatical**: **referencial** — retoma de referentes por pronomes, determinantes ou elipse (**anáfora**: retoma algo já dito — O Rui chegou. Ele…; **catáfora**: antecipa algo que vem depois — Disse-lhe isto: amanhã não há aulas); **frásica** (concordância, ordem das palavras); **interfrásica** — conectores que explicitam relações (adição: além disso; oposição: no entanto; causa: visto que; conclusão: portanto; tempo: depois; exemplificação: por exemplo); **temporal** — articulação dos tempos verbais e advérbios. **Coesão lexical**: repetição, sinonímia, hiperonímia (O cão… O animal…) e substituição por expressões equivalentes (Lisboa… a capital). A **coerência** é a lógica do sentido: o texto não se contradiz e faz sentido no seu contexto.'},
dica:'Ao reler um texto teu, procura palavras repetidas e troca algumas por pronomes ou sinónimos; depois verifica se as ideias estão ligadas por conectores.',
map:['Coesão',[['Gramatical','pronomes, conectores, tempos verbais',[['Referencial','anáfora, catáfora'],['Interfrásica','conectores'],['Temporal','tempos e advérbios']]],['Lexical','sinónimos, hiperónimos, repetição']]],
tabs:[{h:'Conectores',c:['Relação','Conectores'],r:[['Adição','e, além disso, também, ainda'],['Oposição','mas, no entanto, contudo, porém'],['Causa','porque, visto que, uma vez que'],['Conclusão','por isso, portanto, assim, logo'],['Tempo / ordem','primeiro, depois, em seguida, finalmente'],['Exemplificação','por exemplo, nomeadamente'],['Reformulação','ou seja, isto é']]},

{id:'variacao',g:'texto',t:'Variação linguística',sub:'Geográfica, social, situacional e histórica',lv:'m',
ex:{k:'O português não se fala da mesma maneira em todo o lado. Em Portugal dizemos **autocarro**; no Brasil, **ônibus**. E falamos de maneira diferente com os amigos e numa carta ao diretor. Tudo isto é português!',
m:'O português varia de **país para país** (Portugal: autocarro, comboio; Brasil: ônibus, trem), de **região para região** (no Porto pede-se um «cimbalino»; em Lisboa, uma «bica»), conforme o **grupo social** e a **idade** (gírias dos jovens) e conforme a **situação** (registo formal ou informal). Todas estas variedades são português; a **norma-padrão** é a que se usa na escola, nos jornais e nos documentos oficiais.',
g:'O português é língua oficial em nove países (Portugal, Brasil, Angola, Moçambique, Cabo Verde, Guiné-Bissau, São Tomé e Príncipe, Timor-Leste e Guiné Equatorial) e apresenta **variação**: **geográfica** (variedades nacionais — português europeu, português do Brasil… — e **dialetos** regionais: setentrionais, centro-meridionais e insulares), **social** (grupo social, profissão, idade — gírias e calões), **situacional** (registo **formal**, **corrente**, **informal**) e **histórica** (português antigo, clássico, contemporâneo). A **norma-padrão** é a variedade de referência usada no ensino, na comunicação social e em textos oficiais; o **Acordo Ortográfico de 1990** procurou aproximar a ortografia, mantendo diferenças de pronúncia, vocabulário e sintaxe.'},
dica:'Não há variedades «erradas»: há variedades mais ou menos adequadas à situação. Numa prova ou numa carta formal, usa a norma-padrão.',
map:['Variação',[['Geográfica','países e regiões'],['Social','idade, grupo, profissão'],['Situacional','formal e informal'],['Histórica','ao longo do tempo']]],

{id:'abertas',g:'classes',t:'Classes abertas e fechadas',sub:'Quadro geral das dez classes de palavras',lv:'m',
ex:{k:'Há classes de palavras que **estão sempre a ganhar palavras novas**: os nomes (teletrabalho), os verbos (desconfinar), os adjetivos… São **classes abertas**. E há classes com **poucas palavras, que quase nunca mudam**: as preposições (de, em, para), as conjunções (e, mas, ou)… São **classes fechadas**.',
m:'As palavras do português distribuem-se por **dez classes**. As **classes abertas** aceitam novas palavras sem limite: **nome**, **adjetivo**, **verbo**, **advérbio** e **interjeição**. As **classes fechadas** têm um número limitado de palavras, que raramente muda: **determinante**, **pronome**, **quantificador**, **preposição** e **conjunção**. As palavras também podem ser **variáveis** (mudam de forma: gato/gatas, canto/cantámos) ou **invariáveis** (não mudam: ontem, de, mas).',
g:'Segundo o Dicionário Terminológico, as **classes abertas** (nome, adjetivo, verbo, advérbio, interjeição) admitem um inventário ilimitado e recebem constantemente novas unidades por derivação, composição, empréstimo ou outros processos de neologia; as suas palavras têm, sobretudo, **significado lexical** (designam entidades, propriedades, situações). As **classes fechadas** (determinante, pronome, quantificador, preposição, conjunção) têm inventário finito e estável e valor sobretudo **gramatical** (referência, quantificação, relação). Uma mesma forma pode pertencer a classes diferentes conforme o contexto: «um» (artigo indefinido ou quantificador numeral), «este» (determinante ou pronome demonstrativo), «que» (pronome relativo, determinante ou pronome interrogativo, conjunção), «bastante» (quantificador ou advérbio). A **conversão** pode ainda fazer uma palavra mudar de classe sem mudar de forma (o jantar, o sim, o porquê).'},
dica:'Pergunta: posso inventar uma palavra nova desta classe amanhã? Se sim, é uma classe aberta.',
map:['Classes de palavras',[['Abertas','nome, adjetivo, verbo, advérbio, interjeição'],['Fechadas','determinante, pronome, quantificador, preposição, conjunção']]],

{id:'dpq',g:'classes',t:'Determinante, pronome ou quantificador?',sub:'Como distinguir palavras que se confundem',lv:'g',
ex:{m:'Muitas palavras parecem iguais mas pertencem a classes diferentes. Três testes ajudam: a palavra **acompanha um nome** que vem logo a seguir? → **determinante** (Este livro). Está **sozinha, no lugar de um nome**? → **pronome** (Este é meu). Indica **quantidade**? → **quantificador** (Três livros; Todos chegaram).',
g:'O **determinante** ocorre à esquerda do nome, especifica-o e concorda com ele (este livro, o meu livro, que livro?, cujo livro). O **pronome** ocupa o lugar de um grupo nominal e funciona sozinho como sujeito, complemento, etc. (Este é meu; Que queres?; Ninguém veio). O **quantificador** indica a quantidade de entidades e pode surgir com ou sem nome expresso (Comi três bolos / Comi três; Todos os alunos / Todos saíram). Casos frequentes de confusão: **um** (artigo indefinido: «Vi um gato» / quantificador numeral: «Tenho um irmão e duas irmãs»); **que** (determinante interrogativo: «Que livro?»; pronome interrogativo: «Que disseste?»; pronome relativo: «O livro que li»; conjunção: «Disse que vinha»; advérbio: «Que bonito!»); **meu** (determinante: «o meu livro»; pronome: «Esse é o meu»); **qual** (determinante: «Qual casaco?»; pronome: «Qual preferes?»).'},
dica:'Faz o teste do nome: tapa a palavra seguinte. Se havia um nome colado, era determinante; se a palavra estava sozinha, é pronome; se diz «quantos», é quantificador.',
map:['Palavras parecidas',[['Determinante','acompanha o nome — este livro'],['Pronome','substitui o nome — este é meu'],['Quantificador','indica quantidade — três, todos']]],

{id:'irregulares',g:'lexico',t:'Processos irregulares de formação',sub:'Truncação, amálgama, sigla, acrónimo, onomatopeia, conversão',lv:'m',
ex:{k:'Às vezes formamos palavras novas de maneiras especiais: **cortando** um bocado (fotografia → **foto**), **juntando bocados** de duas palavras (português + espanhol → **portunhol**) ou usando só as **primeiras letras** (Comboios de Portugal → **CP**).',
m:'Além da derivação e da composição, há **processos irregulares** de formação de palavras. Na **truncação** corta-se parte da palavra (fotografia → foto; metropolitano → metro; professor → prof). Na **amálgama** juntam-se bocados de duas palavras (português + espanhol → portunhol; cantor + autor → cantautor). A **sigla** forma-se com as iniciais, lidas letra a letra (CP, RTP, PSP, UE). O **acrónimo** forma-se com iniciais ou sílabas, mas lê-se como uma palavra (ONU, NATO, TAP, Fenprof). A **onomatopeia** imita sons (tiquetaque, miau, zás).',
g:'São processos de formação **não regulares** (não aplicam regras morfológicas previsíveis): **truncação** (supressão de parte da palavra: fotografia > foto, cinematógrafo > cinema, televisão > tevê); **amálgama** (fusão de partes de duas palavras: motor + hotel > motel; informação + automática > informática; português + espanhol > portunhol); **siglação** (redução às iniciais, com leitura letra a letra: RTP, CGD, PSP); **acronímia** (iniciais ou sílabas com leitura silábica: ONU, NATO, TAP, Fenprof, Infarmed); **onomatopeia**. Alguns acrónimos lexicalizam-se e escrevem-se em minúsculas (radar, laser, sida). Outros processos de neologia: **conversão** (mudança de classe sem alteração de forma: o jantar, o sim, o belo), **empréstimo** (futebol, abajur) e **extensão semântica** (rato, do computador; navegar, na internet).'},
dica:'Sigla ou acrónimo? Lê em voz alta: se soletras (cê-pê), é sigla; se lês como palavra (ó-nu → ONU), é acrónimo.',
map:['Processos irregulares',[['Truncação','foto, metro, prof'],['Amálgama','portunhol, motel'],['Sigla','CP, RTP — letra a letra'],['Acrónimo','ONU, NATO — como palavra'],['Onomatopeia','tiquetaque, miau'],['Conversão','o jantar, o sim']]],

{id:'hierarquias',g:'lexico',t:'Famílias de palavras e relações lexicais',sub:'Hiperonímia, hiponímia, holonímia, meronímia, campo lexical e campo semântico',lv:'m',
ex:{k:'As palavras organizam-se em grupos. Há **famílias** com o mesmo radical (mar, marinheiro, maré). Há palavras **gerais** que incluem outras mais **particulares** (animal → cão, gato). E há palavras para o **todo** e para as suas **partes** (bicicleta → roda, pedal, guiador).',
m:'**Família de palavras**: palavras com o mesmo radical (pedra, pedreiro, pedregulho, empedrar). **Hiperonímia / hiponímia**: relação de inclusão; o **hiperónimo** é geral (instrumento musical) e os **hipónimos** são específicos (guitarra, piano, violino); os hipónimos do mesmo hiperónimo são **co-hipónimos**. **Holonímia / meronímia**: relação entre o todo e as partes; o **holónimo** é o todo (árvore) e os **merónimos** são as partes (raiz, tronco, ramo, folha). **Campo lexical**: palavras de famílias diferentes ligadas ao mesmo tema (praia: areia, onda, toalha, nadador-salvador). **Campo semântico**: os vários sentidos de uma só palavra (estrela: do céu, de cinema, do mar).',
g:'As **relações lexicais** organizam o léxico. **Relação de família** (morfológica): palavras derivadas ou compostas a partir do mesmo radical. **Hiperonímia / hiponímia** (inclusão: «X é um tipo de Y»): forma hierarquias transitivas (ser vivo > animal > mamífero > cão > labrador), em que cada termo é hipónimo do de cima e hiperónimo do de baixo. **Holonímia / meronímia** (parte-todo: «X é parte de Y»): casa > cozinha > fogão; corpo > braço > mão > dedo. Não confundas: «o cão é um tipo de animal» (hiponímia) ≠ «a pata é parte do cão» (meronímia). **Campo lexical** ≠ família: o campo reúne palavras com radicais diferentes à volta de um tema (escola: professor, recreio, sumário, caderno); a família reúne palavras com o mesmo radical (escola, escolar, escolinha, escolaridade). **Campo semântico**: conjunto de significados que uma palavra (polissémica) assume em diferentes contextos (cabo: de vassoura, de mar, de rede, posto militar).'},
dica:'Testa com frases: «X é um tipo de Y» → hiponímia. «X é uma parte de Y» → meronímia. «Têm o mesmo radical» → família. «Falam do mesmo tema» → campo lexical.',
map:['Relações lexicais',[['Família','mesmo radical — mar, marinheiro'],['Hiperonímia / hiponímia','geral → específico — fruta → maçã'],['Holonímia / meronímia','todo → partes — árvore → tronco'],['Campo lexical','mesmo tema — praia: areia, onda'],['Campo semântico','sentidos de uma palavra — estrela']]],

/* ================= SINTAXE ================= */
{id:'tipologia',g:'oracoes',t:'Classificar orações: quadro geral',sub:'Tipologia completa e método passo a passo',lv:'g',
ex:{k:'Para classificar orações: **conta os verbos** (cada verbo principal costuma ser uma oração), vê se as partes **valem sozinhas** ou se uma **depende** da outra, e olha para a **palavra que liga** as partes.',
m:'Para classificar uma oração, segue três passos. **1.** Divide a frase em orações (um verbo principal por oração). **2.** Vê a relação: se as orações são independentes, são **coordenadas**; se uma depende da outra, há uma **subordinante** e uma **subordinada**. **3.** Olha para a palavra que a introduz e para a função da oração: as subordinadas podem ser **substantivas** (funcionam como nome), **adjetivas** (como adjetivo) ou **adverbiais** (como advérbio).',
g:'**Coordenadas**: copulativas, adversativas, disjuntivas, conclusivas, explicativas (sindéticas ou assindéticas). **Subordinadas substantivas**: completivas (que, se, infinitivo) e relativas sem antecedente (quem, o que, onde). **Subordinadas adjetivas relativas**: restritivas e explicativas. **Subordinadas adverbiais**: causais, temporais, finais, condicionais, concessivas, comparativas e consecutivas. Quanto à forma, as subordinadas são **finitas** (verbo conjugado) ou **não finitas** (infinitivas, gerundivas, participiais). Atenção às palavras com vários valores: **que** (completiva, relativa, consecutiva em «tão… que», comparativa em «mais… do que»), **se** (completiva — pergunta indireta — ou condicional), **como** (causal, comparativa ou conformativa), **quando** (temporal ou, sem antecedente, relativa), **para** (final com infinitivo; preposição noutros casos).'},
dica:'A palavra introdutora não chega: «que» e «se» têm vários valores. Testa a função — troca por «isso» (substantiva), por um adjetivo (relativa) ou faz uma pergunta como «porquê?», «quando?» (adverbial).',
map:['Orações',[['Coordenadas','copulativa, adversativa, disjuntiva, conclusiva, explicativa'],['Subordinadas','',[['Substantivas','completiva, relativa'],['Adjetivas','relativa restritiva, relativa explicativa'],['Adverbiais','causal, temporal, final, condicional, concessiva, comparativa, consecutiva']]]]],

/* ================= SEMÂNTICA ================= */
{id:'aspetolex',g:'semantica',t:'Aspeto lexical',sub:'Estados e eventos: processos, processos culminados, culminações, pontos',lv:'s',
ex:{m:'O próprio significado do verbo (com os seus complementos) já diz como a situação decorre. **Saber** ou **ser alto** são **estados**: não mudam nem têm início ou fim marcados. **Correr** ou **chover** são **processos**: duram, mas não têm um fim natural. **Construir uma casa** é um **processo culminado**: dura e tem um ponto final. **Chegar** ou **encontrar** são **culminações**: acontecem num instante e mudam a situação. **Espirrar** ou **tossir** são **pontos**: instantâneos e sem mudança de estado.',
g:'O **aspeto lexical** (classes aspetuais) depende do verbo e dos seus argumentos; o **aspeto gramatical** depende dos tempos verbais, perífrases e advérbios (ver «Tempo e aspeto gramatical»). Classes: **estados** — não dinâmicos, homogéneos (saber, ter, amar, ser alto); rejeitam normalmente o progressivo (*Está a saber). **Eventos** — dinâmicos: **processos** (duração, sem culminação: correr, nadar, chover; aceitam «durante uma hora»); **processos culminados** (duração + culminação: construir uma casa, ler o livro, comer a sopa; aceitam «em uma hora»); **culminações** (mudança instantânea de estado: chegar, morrer, encontrar, ganhar); **pontos** (instantâneos, sem mudança de estado: espirrar, tossir, piscar). Os complementos alteram a classe: correr (processo) / correr os 100 metros (processo culminado); comer bolo (processo) / comer o bolo (processo culminado). A combinação com o aspeto gramatical produz efeitos: «Estava a chegar» (fase preparatória de uma culminação); «Tossiu durante dez minutos» (ponto + duração = leitura iterativa).'},
dica:'Testa com «durante uma hora» e «em uma hora»: «Correu durante uma hora» (processo); «Leu o livro em uma hora» (processo culminado).',
map:['Aspeto lexical',[['Estados','saber, ter, ser alto'],['Eventos','dinâmicos',[['Processos','correr, chover'],['Processos culminados','construir uma casa'],['Culminações','chegar, morrer'],['Pontos','espirrar, tossir']]]]],

/* ================= TEXTO ================= */
{id:'progressao',g:'texto',t:'Coerência e progressão temática',sub:'Tema e rema; progressão linear, constante e de temas derivados',lv:'s',
ex:{m:'Um texto é **coerente** quando faz sentido: as ideias não se contradizem, ligam-se ao tema e **avançam** (há sempre informação nova). Em cada frase há o **tema** — aquilo de que se fala, já conhecido — e o **rema** — o que se diz de novo. A forma como temas e remas se encadeiam de frase para frase chama-se **progressão temática**.',
g:'A **coerência** é a propriedade que faz de um conjunto de enunciados um texto com sentido. Assenta em quatro princípios: **continuidade** (retoma de elementos já referidos), **progressão** (introdução de informação nova), **não contradição** (interna e com o mundo) e **relação / pertinência** (os factos são compatíveis entre si e relevantes para o tema). Coesão e coerência são distintas: um texto pode ter conectores e pronomes e ser incoerente («O Rui não tem animais. Por isso, o cão dele chama-se Bobi.»). A **progressão temática** descreve o encadeamento tema-rema: **linear** (o rema de uma frase passa a tema da seguinte), **de tema constante** (o mesmo tema mantém-se, com remas diferentes), **de temas derivados** (subtemas que decorrem de um hipertema) e, mais raramente, **de rema dividido** (o rema desdobra-se em vários temas seguintes).'},
dica:'Sublinha o tema de cada frase. Se o tema de uma frase vem do rema da anterior, a progressão é linear; se é sempre o mesmo, é de tema constante.',
map:['Texto',[['Coerência','continuidade, progressão, não contradição, relação'],['Progressão temática','',[['Linear','rema → tema'],['Tema constante','o mesmo tema'],['Temas derivados','subtemas de um hipertema']]]]],

/* ================= FIGURAS DE ESTILO ================= */
{id:'figuras-fonicas',g:'estilo',t:'Figuras de estilo fónicas',sub:'Aliteração, assonância, onomatopeia, paronomásia, rima, harmonia imitativa',lv:'m',
ex:{k:'Às vezes os escritores **brincam com os sons** das palavras. Repetem o mesmo som (**O rato roeu a rolha**), imitam ruídos (**tiquetaque**, **pum!**) ou fazem rimas (**Quem não arrisca não petisca**). São as **figuras de estilo fónicas**.',
m:'As **figuras fónicas** exploram o som das palavras. **Aliteração**: repetição do mesmo som consonântico (O rato roeu a rolha da garrafa do rei da Rússia). **Assonância**: repetição do mesmo som vocálico (Lua nua, rua a rua). **Onomatopeia**: palavra que imita um som (o tiquetaque do relógio; pum!). **Paronomásia**: aproximação de palavras com sons parecidos e sentidos diferentes (Tradutor, traidor). **Rima**: repetição de sons no fim de palavras ou versos (Quem não arrisca não petisca).',
g:'As figuras fónicas atuam no plano do significante. **Aliteração** (repetição de sons consonânticos, sobretudo em início de palavra ou sílaba tónica); **assonância** (repetição de sons vocálicos tónicos); **onomatopeia** (imitação de sons naturais ou mecânicos); **paronomásia** (aproximação de parónimos ou palavras foneticamente próximas com sentidos diferentes, que cria jogo de sentido: «Tradutor, traidor»); **rima** (identidade sonora a partir da última vogal tónica: rima rica, pobre, interna…); **harmonia imitativa** (combinação de aliteração, assonância e ritmo que sugere o som ou movimento evocado). Na análise, identifica a figura **e o seu efeito expressivo** (sugere o som do vento, cria musicalidade, reforça uma ideia).'},
dica:'Lê o texto em voz alta. Se um som (consoante ou vogal) «salta» várias vezes, procura aliteração ou assonância — e pergunta que efeito cria.',

{id:'figuras-semanticas',g:'estilo',t:'Figuras de estilo semânticas',sub:'Metáfora, comparação, personificação, hipérbole, ironia, antítese…',lv:'m',
ex:{k:'Os escritores também **brincam com o sentido** das palavras. Comparam (**forte como um leão**), dizem que uma coisa é outra (**os teus olhos são estrelas**), dão vida às coisas (**o vento cantava**) ou exageram (**já te disse um milhão de vezes!**).',
m:'As **figuras semânticas** jogam com o significado. **Comparação**: aproxima dois elementos com um conector (como, tal como, parece): Forte como um leão. **Metáfora**: identifica dois elementos sem conector: Os teus olhos são estrelas. **Personificação**: dá características humanas a seres não humanos: O vento cantava. **Hipérbole**: exagero: Já te disse isto um milhão de vezes! **Eufemismo**: suaviza uma ideia desagradável: O avô partiu. **Ironia**: diz o contrário do que se pensa: Que bonito! Partiste o vidro. **Antítese**: opõe ideias: Uns riem, outros choram. **Apóstrofe**: interpela alguém ou algo: Ó mar, leva-me contigo!',
g:'Figuras semânticas (de sentido): **comparação** (com conector comparativo); **metáfora** (transferência de sentido por semelhança, sem conector); **personificação / prosopopeia**; **hipérbole**; **eufemismo**; **ironia**; **antítese** (oposição de palavras ou ideias); **oxímoro / paradoxo** (associação de termos contraditórios na mesma expressão: «Amor é fogo que arde sem se ver» — Camões; «silêncio ensurdecedor»); **metonímia** (substituição por relação de contiguidade: autor pela obra — «Li Camões»; continente pelo conteúdo — «Bebi um copo»); **sinédoque** (parte pelo todo: «Há muitas bocas para alimentar»); **sinestesia** (cruzamento de sensações: «voz doce e quente»); **perífrase** (expressão que substitui um nome: «o astro-rei» = o Sol; «a Cidade Invicta» = o Porto); **apóstrofe** («Alma minha gentil, que te partiste» — Camões); **gradação** (sequência em intensidade crescente ou decrescente: «Sussurrou, falou, gritou»). Na análise, indica sempre o **valor expressivo**.'},
dica:'Comparação tem «como» (ou parecido); metáfora não tem. Se dá vida a uma coisa, é personificação; se exagera, é hipérbole.',
map:['Figuras semânticas',[['Semelhança','comparação, metáfora'],['Vida e voz','personificação, apóstrofe'],['Intensidade','hipérbole, gradação, eufemismo'],['Oposição','antítese, oxímoro, ironia'],['Substituição','metonímia, sinédoque, perífrase'],['Sensações','sinestesia']]],
tabs:[{h:'Figuras semânticas',c:['Figura','O que é','Exemplo'],r:[['Comparação','aproxima com «como»','Forte como um leão.'],['Metáfora','identifica sem conector','Os teus olhos são estrelas.'],['Personificação','dá vida humana a coisas','O vento cantava nas árvores.'],['Hipérbole','exagero','Morro de fome!'],['Eufemismo','suaviza','O avô partiu (= morreu).'],['Ironia','diz o contrário','Que bonito! Sujaste tudo.'],['Antítese','opõe ideias','Uns riem, outros choram.'],['Oxímoro / paradoxo','junta contrários','Um silêncio ensurdecedor.'],['Metonímia','substitui por proximidade','Li Camões. Bebi um copo.'],['Sinédoque','parte pelo todo','Muitas bocas para alimentar.'],['Sinestesia','mistura sensações','Uma voz doce e quente.'],['Perífrase','expressão em vez do nome','O astro-rei (= o Sol).'],['Apóstrofe','interpela alguém ou algo','Ó mar, leva-me contigo!'],['Gradação','intensidade crescente','Sussurrou, falou, gritou.']]}],

{id:'figuras-sintaticas',g:'estilo',t:'Figuras de estilo sintáticas',sub:'Anáfora, enumeração, polissíndeto, assíndeto, hipérbato, quiasmo…',lv:'g',
ex:{k:'Os escritores também **brincam com a ordem e a repetição** das palavras: repetem palavras no início das frases, fazem listas, trocam a ordem normal…',
m:'As **figuras sintáticas** (ou de construção) jogam com a organização da frase. **Anáfora**: repetição de palavras no início de frases ou versos. **Enumeração**: sequência de elementos. **Polissíndeto**: repetição da conjunção (E corre, e salta, e ri). **Assíndeto**: ausência de conjunções (Vim, vi, venci). **Hipérbato / anástrofe**: inversão da ordem normal (Da janela, o mar eu via). **Quiasmo**: cruzamento de elementos em espelho (Comer para viver, não viver para comer). **Interrogação retórica**: pergunta sem esperar resposta (Quem não gosta de férias?).',
g:'Figuras de construção: **anáfora** (repetição no início de versos ou frases: «Mudam-se os tempos, mudam-se as vontades, / Muda-se o ser, muda-se a confiança» — Camões; não confundir com a anáfora como mecanismo de coesão); **repetição**; **enumeração** (acumulação de elementos); **polissíndeto** (repetição de conjunções, que abranda e intensifica o ritmo); **assíndeto** (supressão de conjunções, que acelera o ritmo); **hipérbato** e **anástrofe** (alteração da ordem canónica — a anástrofe inverte termos próximos, o hipérbato separa-os); **quiasmo** (estrutura cruzada AB-BA); **paralelismo** (repetição da mesma estrutura sintática); **elipse** (omissão de elementos recuperáveis: «Eu prefiro chá; ela, café»); **pleonasmo** (redundância expressiva: «Vi com os meus próprios olhos»); **interrogação retórica**; **exclamação**. Indica sempre o efeito: ênfase, ritmo, musicalidade, destaque de uma ideia.'},
dica:'Olha para a forma da frase: há repetições no início? Muitos «e»? Nenhum «e»? A ordem está trocada? Os elementos cruzam-se em espelho?',
map:['Figuras sintáticas',[['Repetição','anáfora, repetição, paralelismo'],['Ligação','polissíndeto, assíndeto, enumeração'],['Ordem','hipérbato, anástrofe, quiasmo'],['Omissão e excesso','elipse, pleonasmo'],['Atitude','interrogação retórica']]],
tabs:[{h:'Figuras sintáticas',c:['Figura','O que é','Exemplo'],r:[['Anáfora','repetição no início','Mudam-se os tempos, mudam-se as vontades. (Camões)'],['Enumeração','lista de elementos','Havia livros, mapas, globos, réguas.'],['Polissíndeto','repetição da conjunção','E corre, e salta, e ri, e canta.'],['Assíndeto','sem conjunções','Vim, vi, venci.'],['Hipérbato / anástrofe','inversão da ordem','Da janela, o mar eu via.'],['Quiasmo','cruzamento AB-BA','Comer para viver, não viver para comer.'],['Paralelismo','mesma estrutura repetida','Uns estudam, outros trabalham.'],['Elipse','omissão de um elemento','Eu prefiro chá; ela, café.'],['Pleonasmo','redundância expressiva','Vi com os meus próprios olhos.'],['Interrogação retórica','pergunta sem resposta','Quem não gosta de férias?']]}],

(function(){
  const T=id=>TOPICS.find(t=>t.id===id);
  /* Concordância completa */
  Object.assign(T('concordancia'),{t:'Concordância nominal e verbal',sub:'Sujeito simples, composto e expressões especiais',
  ex:{k:'As palavras de uma frase **combinam** umas com as outras. Se o nome está no plural, o adjetivo e o verbo também ficam: «Os gatos **pretos** **dormem**.» Se há duas pessoas no sujeito, o verbo vai para o plural: «A Ana e o Rui **chegaram**.»',
  m:'**Concordância nominal**: determinantes, quantificadores e adjetivos concordam em género e número com o nome (as casas antigas). **Concordância verbal**: o verbo concorda em pessoa e número com o sujeito. Com **sujeito simples**, concorda com o núcleo: O grupo de alunos **chegou** (núcleo: grupo). Com **sujeito composto**, vai para o plural: A Ana e o Rui **chegaram**; se houver «eu», usa-se «nós»: Tu e eu **vamos**. **Haver** com o sentido de existir e **fazer** com o sentido de tempo ficam no singular: **Havia** problemas; **Faz** dois anos.',
  g:'**Sujeito simples**: o verbo concorda com o núcleo, mesmo que haja complementos no plural (O conjunto de casos **foi** analisado); nomes coletivos levam singular (A turma **saiu**). **Sujeito composto**: anteposto → plural (O pai e a mãe **chegaram**); posposto → plural ou concordância com o núcleo mais próximo (**Chegaram / Chegou** o pai e a mãe); pessoas diferentes → prevalece a 1.ª (Eu e tu **vamos**), depois a 2.ª ou, correntemente, a 3.ª (Tu e ele **ides / vão**); núcleos ligados por **ou** → plural se ambos praticam a ação, singular se há exclusão (O Rui ou o Pedro **será** o delegado); **nem… nem** → normalmente plural. **Expressões**: «a maioria de», «grande parte de», «metade de» + plural → singular ou plural (A maioria dos alunos **chegou / chegaram**); «mais de um» → singular (Mais de um aluno **faltou**); percentagens → concordância com o número ou com o nome (30% dos alunos **faltaram**; 1% da turma **faltou**); «um dos que» → preferencialmente plural (Foi um dos que mais **trabalharam**); pronome relativo «que» → concorda com o antecedente (Fui eu que **fiz**). **Verbos impessoais**: haver (existir) e fazer (tempo) no singular; mas «haver» auxiliar flexiona (Eles **haviam** saído). **Ser**: concorda com o predicativo em horas e em frases com «tudo», «isto» (**São** duas horas; Tudo **são** flores). **Se**: apassivante concorda (Vendem-**se** casas); indeterminado fica no singular (Precisa-**se** de empregados). **Concordância nominal**: adjetivo posposto a vários nomes → masculino plural ou concordância com o mais próximo (camisa e casaco **novos / novo**); anteposto → com o mais próximo (**nova** camisa e casaco); «meio» advérbio invariável (meio cansada) / numeral variável (meia hora); «menos» é invariável (menos pessoas); «obrigado» concorda com quem fala (Obrigada, disse a Ana).'},
  map:['Concordância',[['Nominal','género e número — as casas antigas'],['Verbal','pessoa e número',[['Sujeito simples','concorda com o núcleo'],['Sujeito composto','plural; 1.ª pessoa prevalece'],['Expressões','a maioria de, mais de um, %…'],['Impessoais','haver, fazer — singular']]]]],
  tabs:[{h:'Sujeito simples e composto',c:['Caso','Correto'],r:[['Núcleo singular com complemento plural','O grupo de amigos chegou.'],['Nome coletivo','A turma saiu cedo.'],['Sujeito composto antes do verbo','O pai e a mãe chegaram.'],['Sujeito composto depois do verbo','Chegaram (ou chegou) o pai e a mãe.'],['Eu + outra pessoa','Eu e a Rita vamos.'],['Tu + ele','Tu e ele ides / vão.'],['Ou com exclusão','O Rui ou o Pedro será o delegado.'],['Nem… nem','Nem o Rui nem a Ana vieram.']]},
  {h:'Expressões e casos especiais',c:['Caso','Correto'],r:[['A maioria de + plural','A maioria dos alunos chegou / chegaram.'],['Mais de um','Mais de um aluno faltou.'],['Percentagem','30% dos alunos faltaram. 1% da turma faltou.'],['Um dos que','Foi um dos que mais trabalharam.'],['Relativo «que»','Fui eu que fiz. Foste tu que fizeste.'],['Haver (existir)','Havia muitas pessoas.'],['Haver (auxiliar)','Eles haviam saído.'],['Fazer (tempo)','Faz dois anos.'],['Ser (horas)','São três horas. É meio-dia.'],['Se apassivante','Vendem-se casas.'],['Se indeterminado','Precisa-se de empregados.']]},
  {h:'Concordância nominal: casos difíceis',c:['Caso','Correto','Incorreto'],r:[['Adjetivo depois de vários nomes','camisa e casaco novos','—'],['meio (= um pouco)','Ela está meio cansada.','meia cansada'],['meio (= metade)','meia hora','meio hora'],['menos','menos pessoas','menas pessoas'],['obrigado','Obrigada! (diz a Ana)','Obrigado! (diz a Ana)'],['bastante (quantificador)','bastantes livros','—'],['bastante (advérbio)','bastante cansadas','bastantes cansadas']]}],
  anim:[['[O grupo|núcleo singular|n] de alunos [chegou|singular|v].','O grupo de alunos chegou. O núcleo do sujeito é grupo, no singular. O verbo concorda com ele.'],
  ['[A Ana e o Rui|sujeito composto|n] [chegaram|plural|v].','A Ana e o Rui chegaram. Dois núcleos: o verbo vai para o plural.'],
  ['[Tu e eu|inclui «eu»|pro] [vamos|nós|v].','Tu e eu vamos. Quando o sujeito inclui eu, o verbo vai para a primeira pessoa do plural.'],
  ['[Havia|singular|v] muitas pessoas. · [Faz|singular|v] dois anos.','Havia muitas pessoas. Faz dois anos. Haver e fazer, nestes sentidos, ficam sempre no singular.'],
  ['[Mais de um|singular|q] aluno [faltou|singular|v].','Mais de um aluno faltou. Apesar do sentido, a expressão mais de um leva o verbo para o singular.']],
  exs:['[A maioria dos alunos|expressão partitiva] [votou / votaram|singular ou plural] sim.','Fui eu [que|retoma «eu»] [fiz|1.ª pessoa] o bolo.','[Vendem-se|se apassivante — plural] bicicletas.'],
  q:[{t:'mc',p:'«O conjunto de livros ___ na estante.»',o:['está','estão'],a:0,e:'O núcleo do sujeito é «conjunto».'},
  {t:'mc',p:'«A Ana e eu ___ ao cinema.»',o:['fomos','foram','foi'],a:0},
  {t:'mc',p:'Qual está correta?',o:['Haviam muitas dúvidas.','Havia muitas dúvidas.'],a:1},

  {t:'mc',p:'Qual está correta?',o:['Ela está meia cansada.','Ela está meio cansada.'],a:1,lv:'m'},
  {t:'mc',p:'Qual está correta?',o:['Fui eu que fiz.','Fui eu que fez.'],a:0,lv:'m'},
  {t:'fill',p:'Completa: Há menos (pessoa) do que ontem → Há menos …',a:['pessoas']}]});

  /* Funções sintáticas: frase e grupos */
  Object.assign(T('complementos'),{t:'Funções sintáticas: visão geral',sub:'Ao nível da frase e ao nível dos grupos',
  map:['Funções sintáticas',[['Ao nível da frase','',[['Sujeito','de quem se fala'],['Predicado','o que se diz'],['Vocativo','chamamento'],['Modificador de frase','Felizmente, …']]],['No grupo verbal','',[['Complementos','direto, indireto, oblíquo, agente da passiva'],['Predicativos','do sujeito, do complemento direto'],['Modificador do GV','pode sair']]],['No grupo nominal','',[['Complemento do nome','o medo do escuro'],['Modificadores do nome','restritivo, apositivo']]],['No grupo adjetival','',[['Complemento do adjetivo','cheio de água']]]]],
  tabs:[{h:'Ao nível da frase',c:['Função','Exemplo'],r:[['Sujeito','[O cão] ladra.'],['Predicado','O cão [ladra muito].'],['Vocativo','[Rita], anda cá!'],['Modificador de frase','[Felizmente], ninguém se magoou.']]},
  {h:'Ao nível do grupo verbal',c:['Função','Teste','Exemplo'],r:[['Complemento direto','→ o, a, os, as','Comi [a maçã].'],['Complemento indireto','→ lhe, lhes','Escrevi [à avó].'],['Complemento oblíquo','pedido pelo verbo, não aceita lhe','Gosto [de música].'],['Complemento agente da passiva','por quem? (na passiva)','Foi feito [pelo Rui].'],['Predicativo do sujeito','com verbo copulativo','O Rui está [cansado].'],['Predicativo do compl. direto','caracteriza o CD','Acho o jogo [fácil].'],['Modificador do grupo verbal','pode retirar-se','Joguei [no parque].']]},
  {h:'Ao nível dos grupos nominal e adjetival',c:['Função','Exemplo'],r:[['Complemento do nome','a construção [da ponte]'],['Modificador restritivo do nome','o casaco [azul]'],['Modificador apositivo do nome','Lisboa, [capital de Portugal], …'],['Complemento do adjetivo','cheio [de energia]']]}]});

  /* Dêixis social */
  const dx=T('deixis');dx.map[1].push(['Social','você, o senhor, Vossa Excelência']);
  dx.tabs[0].r.push(['Social','a relação entre os interlocutores','tu, você, o senhor, a senhora doutora']);
  dx.q.push({t:'mc',p:'Em «O senhor deseja mais alguma coisa?», «O senhor» é um deítico…',o:['social','espacial'],a:0,lv:'g'});

  /* renomeações */
  const ren={formacao:['Formação de palavras: derivação e composição','Prefixação, sufixação, parassíntese, derivação não afixal, composição'],relacoes:['Sinónimos, antónimos e relações de forma','Sinonímia, antonímia, homonímia, homofonia, homografia, paronímia'],aspeto:['Tempo e aspeto gramatical','Valor temporal; perfetivo, imperfetivo, habitual, iterativo, genérico'],atos:['Atos de fala (atos ilocutórios)','Assertivos, diretivos, compromissivos, expressivos, declarativos'],subordinacao:['Subordinação: visão geral','Subordinante e subordinada; substantivas, adjetivas e adverbiais']};
  for(const k in ren){const t=T(k);if(t){t.t=ren[k][0];t.sub=ren[k][1]}}
  const f=T('formacao');f.ex.g=f.ex.g.replace('Há ainda palavras formadas por **siglação** (UE, CP) e por **truncação** (foto, metro).','Os processos irregulares (truncação, amálgama, sigla, acrónimo) estão no tema seguinte.');
