/* ---------- marcação de texto ---------- */
const TOK=/\[([^\]|]+)(?:\|([^\]|]*))?(?:\|([a-z]+))?\]|\{([^}>]+)>([^}]+)\}|\*\*([^*]+)\*\*|(\s+)|([^\s\[{*]+)/g;
function mk(s,anim){
  let out='',i=0,m;TOK.lastIndex=0;s=String(s);
  while((m=TOK.exec(s))){
    if(m[1]!==undefined){
      const hasLab=m[2]!==undefined, lab=m[2]||'', c=m[3]||'x';
      const cls='mk c-'+c+(hasLab?'':' nl')+(anim?' w':'');
      out+=`<span class="${cls}" style="--i:${i++}"><span class="mw">${esc(m[1])}</span>${lab?`<span class="ml">${esc(lab)}</span>`:''}</span>`;
    }else if(m[4]!==undefined){
      out+=`<span class="morph${anim?' w':''}" style="--i:${i++}"><span class="ma">${esc(m[4])}</span><span class="mb">${esc(m[5])}</span></span>`;
    }else if(m[6]!==undefined){
      out+=anim?`<span class="w" style="--i:${i++}"><b>${esc(m[6])}</b></span>`:`<b>${esc(m[6])}</b>`;
    }else if(m[7]!==undefined){
      out+=anim?'<span class="sp"> </span>':' ';
    }else{
      out+=anim?`<span class="w" style="--i:${i++}">${esc(m[8])}</span>`:esc(m[8]);
    }
  }
  return out;
}

/* ---------- voz (narração) ---------- */
const TTS={ok:'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window,voice:null,
  pick(){if(!this.ok)return;try{const vs=speechSynthesis.getVoices();this.voice=vs.find(v=>/pt[-_]PT/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null}catch(e){}},
  speak(text,onend){
    if(!this.ok){return null}
    let done=false;const fin=()=>{if(done)return;done=true;onend&&onend()};
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang='pt-PT';if(this.voice)u.voice=this.voice;
      u.rate=band()==='k'?0.9:1;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
    }catch(e){setTimeout(fin,0)}
    return fin;
  },
  stop(){if(this.ok){try{speechSynthesis.cancel()}catch(e){}}}
};
if(TTS.ok){TTS.pick();try{speechSynthesis.addEventListener('voiceschanged',()=>TTS.pick())}catch(e){}}
let sayBtn=null;
function sayToggle(btn,text){
  stopAll();
  if(sayBtn===btn){sayBtn=null;return}
  if(!TTS.ok){toastNoVoice(btn);return}
  sayBtn=btn;btn.classList.add('is-right');
  TTS.speak(plain(text),()=>{btn.classList.remove('is-right');if(sayBtn===btn)sayBtn=null});
}
function toastNoVoice(btn){const p=document.createElement('p');p.className='novoice';p.textContent='Este navegador não tem leitura em voz alta disponível.';btn.after(p);setTimeout(()=>p.remove(),4000)}

/* ---------- leitor de animações ---------- */
const PLAYERS=new Set();
function stopAll(){PLAYERS.forEach(p=>p.stop());TTS.stop();if(sayBtn){sayBtn.classList.remove('is-right');sayBtn=null}}
function Player(root,steps,opts){
  opts=opts||{};
  const uid='v'+Math.random().toString(36).slice(2,8);
  root.innerHTML=`<div class="stage"><span class="stepno"></span><div class="board"></div></div>
  <p class="cap"><span class="spk">${I('spk')}</span><span class="ct"></span></p>
  <div class="ctrl">
    <button class="btn primary sm" data-p="play">${I('play')}<span>Ver com narração</span></button>
    <button class="iconbtn" data-p="prev" aria-label="Passo anterior">${I('prev')}</button>
    <div class="dots">${steps.map((s,i)=>`<button data-p="go" data-i="${i}" aria-label="Passo ${i+1}"></button>`).join('')}</div>
    <button class="iconbtn" data-p="next" aria-label="Passo seguinte">${I('next')}</button>
    ${TTS.ok?`<label class="sw" for="${uid}"><input type="checkbox" id="${uid}" ${S.voice?'checked':''}> Narração</label>`:''}
  </div>${TTS.ok?'':'<p class="novoice">Este navegador não tem leitura em voz alta: a legenda acompanha a animação.</p>'}`;
  const board=$('.board',root),ct=$('.ct',root),no=$('.stepno',root),pb=$('[data-p=play]',root);
  let i=0,playing=false,tm=null;
  function show(n){i=n;board.innerHTML=mk(steps[i][0],true);ct.textContent=steps[i][1];no.textContent=(i+1)+' / '+steps.length;
    $$('.dots button',root).forEach((b,k)=>b.classList.toggle('on',k===i))}
  function setBtn(){pb.innerHTML=playing?I('pause')+'<span>Pausa</span>':I('play')+'<span>'+(S.voice&&TTS.ok?'Ver com narração':'Ver animação')+'</span>'}
  function narrate(){
    clearTimeout(tm);
    const txt=steps[i][1];const est=Math.max(2800,txt.split(/\s+/).length*430);
    const go=()=>{clearTimeout(tm);root.classList.remove('speaking');tm=setTimeout(()=>{if(playing)next()},900)};
    if(S.voice&&TTS.ok){root.classList.add('speaking');const fin=TTS.speak(txt,go);tm=setTimeout(()=>{fin&&fin()},est*2+3000)}
    else tm=setTimeout(()=>{if(playing)next()},est);
  }
  function next(){if(i<steps.length-1){show(i+1);if(playing)narrate()}else{stop()}}
  function stop(){playing=false;clearTimeout(tm);root.classList.remove('speaking');setBtn()}
  function play(){if(playing){stop();TTS.stop();return}
    stopAll();playing=true;if(i>=steps.length-1&&!opts.fresh)i=0;opts.fresh=false;show(i);setBtn();narrate()}
  root.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p;
    if(a==='play')play();
    else{const wasPlaying=playing;stop();TTS.stop();
      if(a==='prev'&&i>0)show(i-1);else if(a==='next'&&i<steps.length-1)show(i+1);else if(a==='go')show(+b.dataset.i);
      if(wasPlaying){playing=true;setBtn();narrate()}}});
  const sw=$('.sw input',root);
  if(sw)sw.addEventListener('change',()=>{S.voice=sw.checked;LS.set('cgp-settings',S);if(!S.voice)TTS.stop();setBtn()});
  const api={stop(){stop()}};PLAYERS.add(api);
  show(0);opts.fresh=true;setBtn();
  return api;
}

/* ---------- exercícios ---------- */
const PRAISE={k:['Muito bem!','Fantástico!','Boa! Acertaste!','És um craque!'],m:['Certo!','Muito bem!','Exatamente!'],g:['Correto.','Certo.','Exato.']};
const OOPS={k:['Quase! Vamos ver porquê.','Ups! Não faz mal, aprende-se assim.'],m:['Não é bem assim.','Errado, mas estás perto.'],g:['Incorreto.','Não é esta a resposta.']};
const pickR=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>{const t=String(s).trim().toLowerCase().replace(/\s+/g,' ');const u=t.replace(/[.!?;:]+$/,'').trim();return u||t};
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
let QID=0;
function Quiz(el,qs,opts){
  opts=opts||{};let answered=0,correct=0;el.innerHTML='';el.classList.add('quiz');
  qs.forEach((q,n)=>{
    const card=document.createElement('div');card.className='q';
    card.innerHTML=`<div class="q-n">Pergunta ${n+1} de ${qs.length}${opts.tag?' · '+esc(opts.tag(q)):''}</div><p class="q-p">${mk(q.p)}</p><div class="q-body"></div><div class="q-fb" hidden></div>`;
    el.appendChild(card);
    build(q,$('.q-body',card),(ok,right)=>{answered++;if(ok)correct++;feedback(card,q,ok,right);if(answered===qs.length)done()},card);
  });
  const sum=document.createElement('div');sum.hidden=true;el.appendChild(sum);
  function done(){
    const r=correct/qs.length,st=r===1?3:r>=.6?2:r>0?1:0;
    const b=band();
    const msg=st===3?(b==='k'?'Perfeito! Acertaste tudo!':'Excelente: tudo certo.'):st===2?'Muito bom trabalho.':st===1?'Vale a pena rever a explicação e tentar outra vez.':'Revê a explicação e as tabelas, e tenta de novo.';
    sum.hidden=false;sum.className='qsum';
    sum.innerHTML=`<div class="stars">${[0,1,2].map(k=>`<span class="${k<st?'':'off'}">${I('star')}</span>`).join('')}</div><div class="big">${correct}/${qs.length}</div><p>${msg}</p><div class="row" style="justify-content:center"><button class="btn sm" data-again>${I('replay')} Repetir</button>${opts.extra||''}</div>`;
    $('[data-again]',sum).onclick=()=>opts.again?opts.again():Quiz(el,qs,opts);
    opts.onDone&&opts.onDone(correct,qs.length);
  }
}
function feedback(card,q,ok,right){
  const b=band(),fb=$('.q-fb',card);card.classList.add(ok?'right':'wrong');fb.hidden=false;fb.classList.remove('hint');
  let t=(ok?pickR(PRAISE[b]):pickR(OOPS[b]));
  if(!ok&&right)t+=' Resposta certa: «'+right+'».';
  if(q.e)t+=' '+q.e;
  fb.textContent=t;
}
function build(q,body,cb,card){
  const id='q'+(++QID);
  if(q.t==='mc'){
    const order=shuffle(q.o.map((o,i)=>i));
    body.innerHTML=`<div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${mk(q.o[i])}</button>`).join('')}</div>`;
    body.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;
      const i=+b.dataset.i;$$('.opt',body).forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('is-right')});
      if(i!==q.a)b.classList.add('is-wrong');cb(i===q.a,plain(q.o[q.a]))});
  }else if(q.t==='fill'){
    body.innerHTML=`<div class="fillrow"><input id="${id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta" placeholder="Escreve aqui…"><button class="btn sm primary">Verificar</button></div>`;
    const inp=$('input',body),btn=$('button',body);let tries=0;
    const check=()=>{const v=norm(inp.value);if(!v)return;
      const ans=q.a.map(norm);
      if(ans.includes(v)){inp.disabled=btn.disabled=true;inp.classList.add('is-right');cb(true);return}
      if(tries===0&&ans.map(noAcc).includes(noAcc(v))){tries++;const fb=$('.q-fb',card);fb.hidden=false;fb.classList.add('hint');fb.textContent='Quase! Repara nos acentos e tenta outra vez.';return}
      inp.disabled=btn.disabled=true;inp.classList.add('is-wrong');cb(false,q.a[0])};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  }else if(q.t==='pick'){
    const re=/\[([^\]]+)\]|[^\s\[]+/g;let m,html='',k=0;
    while((m=re.exec(q.s))){const sp=m.index>0&&/\s/.test(q.s[m.index-1])?' ':'';
      const txt=m[1]!==undefined?m[1]:m[0];
      if(m[1]===undefined&&/^[.,!?;:…—«»]+$/.test(txt)){html+=sp+esc(txt);continue}
      html+=`${sp}<button class="tok" data-t="${m[1]!==undefined?1:0}" data-k="${k++}">${esc(txt)}</button>`}
    body.innerHTML=`<div class="toks">${html}</div><div class="row" style="margin-top:12px"><button class="btn sm primary">Verificar</button></div>`;
    const ver=$('.row .btn',body);
    body.addEventListener('click',e=>{const t=e.target.closest('.tok');if(!t||t.disabled)return;t.classList.toggle('sel')});
    ver.onclick=()=>{let ok=true;$$('.tok',body).forEach(t=>{const tg=t.dataset.t==='1',sel=t.classList.contains('sel');t.disabled=true;
        if(tg)t.classList.add('tgt');if(sel&&!tg)t.classList.add('bad');if(tg!==sel)ok=false});
      ver.disabled=true;cb(ok,ok?null:$$('.tok',body).filter(t=>t.dataset.t==='1').map(t=>t.textContent).join(', '))};
  }else if(q.t==='cat'){
    const items=shuffle(q.items);let left=items.length,allOk=true;
    body.innerHTML=items.map((it,r)=>`<div class="crow"><span class="ci">${esc(it[0])}</span><div class="cbs">${q.cats.map((c,ci)=>`<button class="cb" data-r="${r}" data-c="${ci}">${esc(c)}</button>`).join('')}</div></div>`).join('');
    body.addEventListener('click',e=>{const b=e.target.closest('.cb');if(!b||b.disabled)return;const r=+b.dataset.r,c=+b.dataset.c,rt=items[r][1];
      $$(`.cb[data-r="${r}"]`,body).forEach(x=>{x.disabled=true;if(+x.dataset.c===rt)x.classList.add('is-right')});
      if(c!==rt){b.classList.add('is-wrong');allOk=false}
      if(--left===0)cb(allOk)});
  }
}

['Conjuntivo',[['cpres','Presente'],['cimp','Pretérito imperfeito'],['cfut','Futuro']]],

function conjugate(v){
  if(IRR[v]){const o={};for(const k in IRR[v])o[k]=IRR[v][k].split(' ').map(f=>[f,'']);return o}
  const t=v.slice(-2),r=v.slice(0,-2),e=END[t],o={};
  ['pres','perf','imp','mqp','cpres','cimp','cfut','imper'].forEach(k=>o[k]=e[k].split(' ').map(x=>[r,x]));
  o.fut='ei ás á emos eis ão'.split(' ').map(x=>[v,x]);o.cond='ia ias ia íamos íeis iam'.split(' ').map(x=>[v,x]);
  o.inf=[[r,t]];o.ger=[[r,e.ger]];o.part=[[r,e.part]];return o;
}
function Conjugator(root){
  let verb='cantar',mode=0;
  function draw(){
    const c=conjugate(verb),irr=!!IRR[verb];
    root.innerHTML=`<div class="verbs" role="group" aria-label="Escolhe o verbo">${VERBS.map(v=>`<button data-v="${v}" class="${v===verb?'on':''}">${v}</button>`).join('')}</div>
    <div class="modes" role="group" aria-label="Escolhe o modo">${MODES.map((m,i)=>`<button data-m="${i}" class="${i===mode?'on':''}">${m[0]}</button>`).join('')}</div>
    <div class="tenses">${MODES[mode][1].map(([k,name])=>{const f=c[k];const lab=PRE[k]||(f.length===6?P6:['']);
      return `<div class="tense"><h5>${name}<button data-say="${k}" aria-label="Ouvir ${name}">${I('spk')}</button></h5>${f.map((x,j)=>`<div>${lab[j]?`<i>${lab[j]}</i>`:''}<span>${esc(x[0])}<b>${esc(x[1])}</b></span></div>`).join('')}</div>`}).join('')}</div>
    <p class="legendc">${irr?'«'+verb+'» é um verbo irregular: muda também o radical.':'Verbo regular: o radical <b>'+esc(verb.slice(0,-2))+'</b> mantém-se e só muda a terminação (a cor).'}${mode===2?' No imperativo, «você» e «vocês» usam as formas do conjuntivo.':''}</p>`;
  }
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.v){verb=b.dataset.v;draw()}else if(b.dataset.m){mode=+b.dataset.m;draw()}
    else if(b.dataset.say){const k=b.dataset.say,f=conjugate(verb)[k],lab=PRE[k]||(f.length===6?P6:['']);
      sayToggle(b,f.map((x,j)=>(lab[j]?lab[j].replace(/[()]/g,'').replace('ele/ela','ele').replace('eles/elas','eles')+' ':'')+x[0]+x[1]).join(', '))}});
  draw();
}

/* ---------- índice ---------- */
const doneOf=id=>P[id]&&P[id].c/P[id].t>=.6;

const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const KEY=t=>fold([t.t,t.sub,JSON.stringify(t.map||''),(t.tabs||[]).map(x=>x.r.map(r=>r[0]).join(' ')).join(' ')].join(' ').replace(/[\[\]"|,]/g,' '));
function bindSearch(root){
  const inp=$('input[type=search]',root);if(!inp)return;
  let msg=document.createElement('p');msg.className='sqmsg';msg.hidden=true;inp.parentNode.appendChild(msg);
  inp.addEventListener('input',()=>{const q=fold(inp.value.trim());let n=0;
    $$('a[data-k]',root).forEach(a=>{const ok=!q||a.dataset.k.includes(q);a.hidden=!ok;if(ok)n++});
    $$('h3',root).forEach(h=>{let e=h.nextElementSibling,any=false;while(e&&e.tagName==='A'){if(!e.hidden)any=true;e=e.nextElementSibling}h.hidden=!any});
    $$('.sidehome',root).forEach(a=>a.hidden=!!q);
    msg.hidden=!q;msg.textContent=n?n+(n===1?' tema encontrado':' temas encontrados'):'Nenhum tema encontrado. Experimenta outra palavra.';});
}
function bnav(prev,next){
  const nav=$('#bnav');
  nav.innerHTML=`<button id="bnMenu">${I('book')}Índice</button>
  <a href="${prev?'#'+prev.id:'#inicio'}" ${prev||next?'':'aria-disabled="true"'}>${I('prev')}${prev?'Anterior':'Início'}</a>
  <a href="#desafio">${I('bolt')}Desafio</a>

/* ---------- páginas ---------- */
const GREET={k:'Olá! Aqui vais descobrir como funcionam as palavras: com cores, animações que falam contigo e jogos para treinar.',m:'Toda a gramática do Português explicada de forma simples, com esquemas, animações narradas e exercícios para treinar ao teu ritmo.',g:'Compêndio de consulta e treino: explicações segundo o Dicionário Terminológico, tabelas-síntese, animações narradas e exercícios com correção imediata.'};
const LEG=[['n','Nome','nome'],['det','Determinante','determinante'],['adj','Adjetivo','adjetivo'],['pro','Pronome','pronome'],['q','Quantificador','quantificador'],['v','Verbo','verbo'],['adv','Advérbio','adverbio'],['prep','Preposição','preposicao'],['conj','Conjunção','conjuncao'],['int','Interjeição','interjeicao']];
function renderHome(){
  const done=TOPICS.filter(t=>doneOf(t.id)).length;
  main.innerHTML=`<div class="page home">
  <div class="review">${I('quote')}<div><b>Versão 0.11.</b> Esta aplicação funciona sem internet e atualiza-se sozinha sempre que a abres com ligação.</div></div>
  <section class="hero">
    <p class="eyebrow">Português europeu · do 1.º ciclo ao secundário</p>

  ${GROUPS.map(g=>{const ts=TOPICS.map((t,n)=>[t,n]).filter(x=>x[0].g===g.id);
    return `<section class="gsec" style="--gc:${GC(g.id)}"><div class="gh"><h2>${g.t}</h2><span>${ts.length} temas</span></div><div class="cards">${ts.map(([t,n])=>`<a class="tc" href="#${t.id}"><span class="n">${String(n+1).padStart(2,'0')}</span><b>${t.t}</b><small>${t.sub}</small><span class="st"><span class="badge">${LVTXT[t.lv]}</span>${doneOf(t.id)?`<span class="badge done">${I('check').replace('<svg','<svg width="12" height="12"')} Concluído</span>`:''}</span></a>`).join('')}</div></section>`}).join('')}
  </div>`;
  Player($('#heroPlayer'),[
    ['[O|determinante|det] [gato|nome|n] [preto|adjetivo|adj] [dorme|verbo|v] [no|preposição|prep] [sofá|nome|n].','O gato preto dorme no sofá. Cada palavra tem uma classe, e cada classe tem uma cor.'],
    ['[Ele|pronome|pro] [ronrona|verbo|v] [e|conjunção|conj] [sonha|verbo|v] [tranquilamente|advérbio|adv].','Ele ronrona e sonha tranquilamente. Neste compêndio vais conhecer todas estas palavras.'],
    ['[Ah|interjeição|int]! [Três|quantificador|q] gatos!','Ah! Três gatos! Vamos começar?']]);

function tree(node){
  const [l,d,kids]=node;
  return `<li><span class="node"><b>${esc(l)}</b>${d?`<span>${esc(d)}</span>`:''}</span>${kids?`<ul>${kids.map(tree).join('')}</ul>`:''}</li>`;
}
function renderTopic(t){
  const n=TOPICS.indexOf(t),b=band(),g=GROUPS.find(x=>x.id===t.g);
  const prev=TOPICS[n-1],next=TOPICS[n+1];
  const ex=t.ex[b]||t.ex.m;
  const note=RANK[t.lv]>RANK[b]?(b==='k'?'Este tema costuma estudar-se mais tarde. Explicamos de forma simples; se precisares, pede ajuda a um adulto.':'Tema mais avançado: está explicado de forma simples, mas vale a pena ires com calma.'):'';
  let qs=t.q.filter(q=>!q.lv||RANK[q.lv]<=RANK[b]);if(qs.length<3)qs=t.q.slice();
  main.innerHTML=`<article class="page topic" style="--gc:${GC(t.g)}">
  <header class="t-head">
    <p class="eyebrow">${g.t} · Tema ${n+1} de ${TOPICS.length}</p>
    <h1>${t.t}</h1><p class="sub">${t.sub}</p>

    <div class="jump">${[['ex','Explicação'],['map','Esquema e tabelas'],['anim','Animação'],['exs','Exemplos'],['q','Exercícios']].map(x=>`<button data-jump="sec-${x[0]}">${x[1]}</button>`).join('')}</div>
  </header>
  <section class="sec" id="sec-ex"><h2><span class="ic">${I('text')}</span>Explicação</h2>
    <div class="prose"><p>${mk(ex)}</p></div>
    <div class="row" style="margin-top:14px"><button class="btn sm ghost" id="sayEx">${I('spk')} Ouvir a explicação</button></div>
    ${note?`<p class="note">${note}</p>`:''}
    ${t.dica?`<aside class="dica"><strong>Dica do professor</strong>${mk(t.dica)}</aside>`:''}
  </section>
  <section class="sec" id="sec-map"><h2><span class="ic">${I('map')}</span>Esquema e tabelas</h2>
    <div class="grid2">
      ${t.map?`<div class="tblock"><h4>Esquema</h4><div class="tree"><span class="root">${esc(t.map[0])}</span><ul>${t.map[1].map(tree).join('')}</ul></div></div>`:''}
      ${(t.tabs||[]).map(tb=>`<div class="tblock"><h4>${esc(tb.h)}</h4><div class="tw"><table><thead><tr>${tb.c.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${tb.r.map(r=>`<tr>${r.map(c=>`<td>${mk(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('')}
    </div>
    ${t.conj?`<h4 style="margin:26px 0 10px;font-size:1.1rem">Conjugador interativo</h4><div class="conj" id="conj"></div>`:''}
  </section>
  <section class="sec" id="sec-anim"><h2><span class="ic">${I('film')}</span>Animação narrada</h2><div id="player"></div></section>
  <section class="sec" id="sec-exs"><h2><span class="ic">${I('quote')}</span>Frases com exemplos</h2>
    <ul class="exs">${t.exs.map((e,i)=>`<li><button class="iconbtn say" data-sayex="${i}" aria-label="Ouvir exemplo">${I('spk')}</button>${mk(e)}</li>`).join('')}</ul></section>
  <section class="sec" id="sec-q"><h2><span class="ic">${I('target')}</span>Exercícios</h2><div id="quiz"></div></section>
  <nav class="pn">${prev?`<a href="#${prev.id}"><small>← Anterior</small><b>${prev.t}</b></a>`:''}${next?`<a class="nx" href="#${next.id}"><small>Seguinte →</small><b>${next.t}</b></a>`:`<a class="nx" href="#desafio"><small>Para terminar →</small><b>Desafio relâmpago</b></a>`}</nav>
  </article>`;
  $('#sayEx').onclick=e=>sayToggle(e.currentTarget,ex);
  $$('[data-sayex]',main).forEach(bt=>bt.onclick=()=>sayToggle(bt,t.exs[+bt.dataset.sayex]));
  $$('[data-jump]',main).forEach(bt=>bt.onclick=()=>{const s=document.getElementById(bt.dataset.jump);s&&s.scrollIntoView({behavior:'smooth',block:'start'})});
  if(t.conj)Conjugator($('#conj'));
  Player($('#player'),t.anim);
  Quiz($('#quiz'),qs,{onDone:(c,tot)=>{const old=P[t.id];if(!old||c/tot>=old.c/old.t){P[t.id]={c,t:tot};LS.set('cgp-progress',P)}renderSide(t.id)},
    extra:next?`<a class="btn sm primary" href="#${next.id}">Próximo tema ${I('next')}</a>`:''});
  bnav(prev,next);
}
function renderIndex(){
  main.innerHTML=`<div class="page idxpage"><header class="t-head"><p class="eyebrow">Compêndio</p><h1>Índice</h1><p class="sub">Toca num tema para o abrires.</p></header><nav class="side" aria-label="Índice completo" style="margin-top:20px">${side.innerHTML.replace('id="sq-side"','id="sq-idx"')}</nav></div>`;
  bindSearch($('.idxpage .side',main));
  bnav(null,TOPICS[0]);
}
function renderChallenge(){
  const b=band();
  const pool=[];TOPICS.forEach(t=>t.q.forEach(q=>{if(!q.lv||RANK[q.lv]<=RANK[b])pool.push(Object.assign({_t:t.t},q))}));
  const qs=shuffle(pool).slice(0,10);
  main.innerHTML=`<div class="page" style="--gc:var(--c-v)"><header class="t-head"><p class="eyebrow">Revisão geral</p><h1>Desafio relâmpago</h1><p class="sub">Dez perguntas ao acaso, de todos os temas. Cada desafio é diferente.</p></header><section class="sec" style="margin-top:28px"><div id="quiz"></div></section></div>`;
  Quiz($('#quiz'),qs,{tag:q=>q._t,again:renderChallenge});
  bnav(null,null);
}

/* ---------- navegação ---------- */
function route(){
  stopAll();
  const id=(location.hash||'').slice(1)||'inicio';
  const t=TOPICS.find(x=>x.id===id);
  renderSide(t?t.id:id==='desafio'?'desafio':'inicio');
  if(t)renderTopic(t);else if(id==='desafio')renderChallenge();else if(id==='indice')renderIndex();else renderHome();
  document.title=(t?t.t+' · ':'')+'Compêndio da Gramática de Português';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSide()}});
applySettings();route();
if(S.age==null)openSetup(true);
})();

<script>
/* Camada da aplicação instalável: registo do service worker, botão Instalar, avisos de atualização e de modo offline */
(function(){
'use strict';
const VERSION='0.11';
const $=s=>document.querySelector(s);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

/* ---- avisos ---- */
const box=document.createElement('div');box.className='toastbox';box.setAttribute('role','status');box.setAttribute('aria-live','polite');document.body.appendChild(box);
function toast(msg,ms){const t=document.createElement('div');t.className='toast';t.textContent=msg;box.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400)},ms||4000)}

/* ---- versão nova ---- */
const last=LS.get('cgp-app-version');
if(!last)LS.set('cgp-app-version',VERSION);
else if(last!==VERSION)setTimeout(()=>{toast('Compêndio atualizado para a versão '+VERSION+'.',5000);LS.set('cgp-app-version',VERSION)},1200);

/* ---- sem internet ---- */
const off=document.createElement('div');off.className='offchip';off.hidden=navigator.onLine;off.textContent='Sem internet · a usar a versão guardada';
$('.top-in').insertBefore(off,$('#setBtn'));
addEventListener('online',()=>{off.hidden=true;toast('Ligação restabelecida.');if(reg)reg.update().catch(()=>{})});
addEventListener('offline',()=>{off.hidden=false});

/* ---- service worker ---- */
let reg=null;
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  let reloading=false;const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading||!hadController)return;reloading=true;location.reload();
  });
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{
    reg=r;r.update().catch(()=>{});
    navigator.serviceWorker.ready.then(()=>{if(!LS.get('cgp-sw-ready')){LS.set('cgp-sw-ready','1');toast('Pronto: o compêndio já funciona sem internet.',5000)}});
  }).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&reg&&navigator.onLine)reg.update().catch(()=>{})});
}

/* ---- instalar ---- */
let deferred=null;
const ib=document.createElement('button');ib.className='who installbtn';ib.hidden=true;
ib.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Instalar</span>';
$('.top-in').insertBefore(ib,$('#setBtn'));
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone())ib.hidden=false});
addEventListener('appinstalled',()=>{ib.hidden=true;deferred=null;toast('Aplicação instalada.')});
if(isIOS&&!standalone())ib.hidden=false;
ib.onclick=async()=>{
  if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;ib.hidden=true;return}
  helpSheet();
};
function helpSheet(){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ihT"><h2 id="ihT">Instalar o compêndio</h2>
  <p class="intro">Depois de instalado, abre como uma aplicação, funciona sem internet e atualiza sozinho sempre que o abrires com ligação.</p>
  ${isIOS?`<h3>iPhone e iPad (Safari)</h3><ol class="steps"><li>Toca no botão <b>Partilhar</b> (quadrado com seta para cima).</li><li>Escolhe <b>Adicionar ao ecrã principal</b>.</li><li>Toca em <b>Adicionar</b>.</li></ol>`:`
  <h3>Android (Chrome)</h3><ol class="steps"><li>Toca no menu <b>⋮</b>.</li><li>Escolhe <b>Instalar aplicação</b> ou <b>Adicionar ao ecrã principal</b>.</li></ol>
  <h3>Computador (Chrome ou Edge)</h3><ol class="steps"><li>Clica no ícone de instalar, à direita da barra de endereço.</li><li>Ou abre o menu e escolhe <b>Instalar Compêndio…</b></li></ol>
  <h3>iPhone e iPad</h3><ol class="steps"><li>Abre no <b>Safari</b>, toca em <b>Partilhar</b> e depois em <b>Adicionar ao ecrã principal</b>.</li></ol>`}
  <div class="row"><button class="btn primary" data-x>Percebi</button></div></div>`;
  document.body.appendChild(ov);ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-x]'))ov.remove()});
}

/* ---- versão nos ajustes ---- */
new MutationObserver(()=>{
  const sh=$('#setup .sheet');if(!sh||sh.querySelector('.verrow'))return;
  const r=document.createElement('div');r.className='verrow';
  r.innerHTML=`<span>Versão ${VERSION}${standalone()?' · aplicação instalada':''}</span><button class="btn sm ghost" type="button">Procurar atualizações</button>`;
  sh.appendChild(r);
  r.querySelector('button').onclick=async()=>{
    if(!navigator.onLine){toast('Sem internet. Tenta quando tiveres ligação.');return}
    try{if(reg)await reg.update()}catch(e){}
    toast('A carregar a versão mais recente…',2000);setTimeout(()=>location.reload(),600);
  };
}).observe($('#setup'),{childList:true});
})();

</script>
</body>
</html>
